<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>รายการยาในกล่อง</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0fdfa;
      --card: #ffffff;
      --ink: #134e4a;
      --muted: #5f7c78;
      --line: #ccfbf1;
      --accent: #0f766e;
      --warn: #b45309;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Sarabun', system-ui, sans-serif;
      background: linear-gradient(180deg, #ccfbf1 0%, var(--bg) 180px, #f8fafc 100%);
      color: var(--ink);
      min-height: 100vh;
    }
    .wrap { max-width: 520px; margin: 0 auto; padding: 20px 16px 48px; }
    .hero, .panel, .item {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(15, 118, 110, 0.06);
    }
    .hero { padding: 16px; }
    .eyebrow { font-size: 0.8rem; color: var(--muted); margin: 0 0 4px; }
    h1 { margin: 0; font-size: 1.4rem; line-height: 1.25; }
    .meta { margin-top: 10px; display: grid; gap: 4px; font-size: 0.92rem; color: var(--muted); }
    .meta strong { color: var(--ink); }
    .status {
      display: inline-block; margin-top: 10px; padding: 4px 10px; border-radius: 999px;
      background: #ecfdf5; color: var(--accent); font-size: 0.85rem; font-weight: 600;
    }
    .row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    h2 { margin: 14px 0 8px; font-size: 0.98rem; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    #items { display: flex; flex-direction: column; gap: 4px; }
    .item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px; margin-bottom: 0;
    }
    .item-body { flex: 1; min-width: 0; }
    .item-name { font-weight: 600; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item-sub { margin-top: 1px; color: var(--muted); font-size: 0.7rem; }
    .item-qty { font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
    .item-exp { font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
    .item-actions { margin-top: 0; display: flex; gap: 4px; flex-shrink: 0; }
    .item-actions .btn-sm { padding: 4px 8px; font-size: 0.75rem; }
    .exp-ok { color: var(--accent); }
    .exp-warn { color: var(--warn); font-weight: 600; }
    .exp-bad { color: var(--danger); font-weight: 700; }
    .empty, .error, .loading { text-align: center; padding: 28px 12px; color: var(--muted); }
    .error { color: var(--danger); }
    .foot { margin-top: 20px; text-align: center; font-size: 0.8rem; color: var(--muted); }
    .btn {
      border: 0; border-radius: 10px; padding: 10px 14px; font: inherit; font-weight: 600;
      cursor: pointer; background: var(--accent); color: #fff;
    }
    .btn:disabled { opacity: 0.6; }
    .btn-outline { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
    .btn-danger { background: var(--danger); }
    .btn-sm { padding: 7px 10px; font-size: 0.85rem; }
    .toast-wrap { position: fixed; left: 12px; right: 12px; bottom: 16px; z-index: 40; display: grid; gap: 8px; }
    .toast { background: #134e4a; color: #fff; padding: 10px 12px; border-radius: 10px; font-size: 0.9rem; }
    .toast.err { background: var(--danger); }
    .modal {
      display: none; position: fixed; inset: 0; z-index: 30; background: rgba(15, 23, 42, 0.45);
      padding: 20px 12px; overflow: auto;
    }
    .modal.open { display: block; }
    .panel { max-width: 440px; margin: 10vh auto 0; padding: 16px; }
    .panel h3 { margin: 0 0 12px; font-size: 1.1rem; }
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
    .field input, .field select {
      width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
      font: inherit; background: #fff;
    }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
    .actor {
      margin-top: 12px; display: flex; align-items: center; justify-content: space-between;
      gap: 8px; flex-wrap: wrap; font-size: 0.88rem; color: var(--muted);
    }
    .actor strong { color: var(--ink); }
    .modal.login { z-index: 45; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="loading" class="loading">กำลังโหลดรายการยา...</div>
    <div id="error" class="error" style="display:none;"></div>
    <div id="content" style="display:none;">
      <div class="hero">
        <p class="eyebrow">🚑 กล่องยาฉุกเฉิน · เฉพาะกล่องนี้</p>
        <h1 id="boxNo">-</h1>
        <div class="meta">
          <div>แผนกปัจจุบัน: <strong id="department">-</strong></div>
          <div>แผนกประจำ: <strong id="homeDepartment">-</strong></div>
          <div>วันหมดอายุใกล้สุด: <strong id="expiryDate">-</strong></div>
        </div>
        <div class="status" id="status">-</div>
        <div class="actor">
          <span>ผู้ทำรายการ: <strong id="actorLabel">-</strong></span>
          <button type="button" class="btn btn-outline btn-sm" id="btnChangeActor">เปลี่ยนชื่อ</button>
        </div>
        <div class="row-actions">
          <button type="button" class="btn btn-outline btn-sm" id="btnEditBoxNo">✏️ แก้ชื่อกล่อง</button>
        </div>
      </div>

      <h2>
        <span>รายการยา (<span id="itemCount">0</span>)</span>
        <button type="button" class="btn btn-sm" id="btnAddItem">➕ เพิ่มยา</button>
      </h2>
      <div id="items"></div>
      <p class="foot">สแกนจากฉลาก QR ของกล่องนี้เท่านั้น · ไม่แสดงกล่องอื่น</p>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

  <div class="modal" id="boxModal">
    <div class="panel">
      <h3>แก้ชื่อกล่อง</h3>
      <div class="field"><label>หมายเลข/ชื่อกล่อง *</label><input id="fBoxNo" type="text" maxlength="80"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" data-close="boxModal">ยกเลิก</button>
        <button type="button" class="btn" id="btnSaveBoxNo">บันทึก</button>
      </div>
    </div>
  </div>

  <div class="modal login" id="loginModal">
    <div class="panel">
      <h3>ลงชื่อก่อนใช้งาน</h3>
      <p class="field" style="color:var(--muted); font-size:0.9rem; margin:0 0 12px;">กรุณากรอกชื่อและตำแหน่ง เพื่อบันทึกว่าใครแก้ไขกล่องนี้</p>
      <div class="field"><label>ชื่อของคุณ *</label><input id="fLoginName" type="text" maxlength="80" placeholder="เช่น นําพล, ลำดวน"></div>
      <div class="field">
        <label>ตำแหน่ง *</label>
        <select id="fLoginPosition">
          <option value="">-- เลือก --</option>
          <option value="เภสัชกร">เภสัชกร</option>
          <option value="พยาบาล">พยาบาล</option>
          <option value="ผู้ช่วย">ผู้ช่วย</option>
          <option value="อื่นๆ">อื่นๆ</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="btnLoginCancel" style="display:none;">ยกเลิก</button>
        <button type="button" class="btn" id="btnLoginSubmit">เข้าใช้งาน</button>
      </div>
    </div>
  </div>

  <div class="modal" id="itemModal">
    <div class="panel">
      <h3 id="itemModalTitle">เพิ่มยา</h3>
      <div class="field"><label>ชื่อยา *</label><input id="fDrugName" type="text" maxlength="200"></div>
      <div class="field"><label>หน่วย</label><input id="fUnit" type="text" maxlength="40" placeholder="เช่น amp, tab"></div>
      <div class="field"><label>จำนวน</label><input id="fQty" type="text" maxlength="40"></div>
      <div class="field"><label>วันหมดอายุ</label><input id="fExpiry" type="date"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" data-close="itemModal">ยกเลิก</button>
        <button type="button" class="btn" id="btnSaveItem">บันทึก</button>
      </div>
    </div>
  </div>

  <script>
    const TOKEN = <?!= JSON.stringify(token) ?>;
    const BOX_ID = <?!= JSON.stringify(boxId || '') ?>;
    const LOGIN_SESSION_MS = 10 * 60 * 1000;
    let currentData = null;
    let editingSheetRow = null;
    let currentUser = { userId: '', name: '', position: '' };
    let changingActor = false;

    function escapeHtml(str) {
      return (str === null || str === undefined) ? '' : String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#x27;');
    }

    function toast(msg, isErr) {
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast' + (isErr ? ' err' : '');
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(function() { el.remove(); }, 2800);
    }

    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    document.querySelectorAll('[data-close]').forEach(function(btn) {
      btn.addEventListener('click', function() { closeModal(btn.getAttribute('data-close')); });
    });

    function getSavedUser() {
      try { const s = localStorage.getItem('currentUser'); return s ? JSON.parse(s) : null; } catch (e) { return null; }
    }
    function clearUser() { try { localStorage.removeItem('currentUser'); } catch (e) {} }
    function saveUser(u) {
      try {
        const payload = Object.assign({}, u, { loggedAt: Date.now() });
        localStorage.setItem('currentUser', JSON.stringify(payload));
        currentUser = payload;
      } catch (e) {}
    }
    function getValidSavedUser() {
      const saved = getSavedUser();
      if (!saved || !saved.name || !saved.position) { clearUser(); return null; }
      const loggedAt = Number(saved.loggedAt) || 0;
      if (!loggedAt || (Date.now() - loggedAt) > LOGIN_SESSION_MS) {
        clearUser();
        return null;
      }
      return saved;
    }
    function actorLabel() {
      const u = getValidSavedUser() || currentUser;
      if (u && u.name && u.position) return u.name + ' (' + u.position + ')';
      if (u && u.name) return String(u.name);
      return '';
    }
    function refreshActorChip() {
      const el = document.getElementById('actorLabel');
      if (el) el.textContent = actorLabel() || 'ยังไม่ลงชื่อ';
    }
    function requireActor() {
      const label = actorLabel();
      if (label) return label;
      toast('กรุณาลงชื่อก่อนแก้ไข', true);
      openLoginModal(true);
      return '';
    }
    function openLoginModal(allowCancel) {
      changingActor = !!allowCancel;
      const saved = getValidSavedUser() || currentUser;
      document.getElementById('fLoginName').value = saved && saved.name ? saved.name : '';
      document.getElementById('fLoginPosition').value = saved && saved.position ? saved.position : '';
      document.getElementById('btnLoginCancel').style.display = changingActor ? '' : 'none';
      openModal('loginModal');
    }

    function expiryClass(dateStr) {
      if (!dateStr) return '';
      const d = new Date(String(dateStr) + 'T00:00:00+07:00');
      if (isNaN(d.getTime())) return '';
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const diff = Math.round((d - today) / 86400000);
      if (diff < 0) return 'exp-bad';
      if (diff <= 120) return 'exp-warn';
      return 'exp-ok';
    }

    function formatEditedAt(val) {
      if (!val) return '';
      const d = (val instanceof Date) ? val : new Date(val);
      if (isNaN(d.getTime())) return String(val);
      const pad = function(n) { return String(n).padStart(2, '0'); };
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
        ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function showError(msg) {
      document.getElementById('loading').style.display = 'none';
      const el = document.getElementById('error');
      el.style.display = 'block';
      el.textContent = msg;
    }

    function render(data) {
      currentData = data;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      refreshActorChip();
      const box = data.box || {};
      const items = data.items || [];

      if (BOX_ID && box.boxId && String(box.boxId) !== String(BOX_ID)) {
        showError('QR ไม่ตรงกับกล่องนี้ — ดูได้เฉพาะกล่องของฉลากที่สแกน');
        return;
      }

      document.getElementById('boxNo').textContent = box.boxNo || '-';
      document.getElementById('department').textContent = box.department || '-';
      document.getElementById('homeDepartment').textContent = box.homeDepartment || '-';
      document.getElementById('expiryDate').textContent = box.expiryDate || 'ไม่ระบุ';
      document.getElementById('status').textContent = box.status || '-';
      document.getElementById('itemCount').textContent = String(items.length);

      const list = document.getElementById('items');
      if (!items.length) {
        list.innerHTML = '<div class="empty">ไม่มีรายการยาในกล่องนี้</div>';
        return;
      }
      list.innerHTML = items.map(function(item) {
        const cls = expiryClass(item.expiryDate);
        const when = formatEditedAt(item.lastEditedAt);
        const who = item.lastEditedBy ? String(item.lastEditedBy) : '';
        const lastEdited = who && when ? (who + ' · ' + when) : (who || when || '');
        return (
          '<div class="item">' +
            '<div class="item-body">' +
              '<div class="item-name">' + escapeHtml(item.drugName || '-') + '</div>' +
              (lastEdited ? '<div class="item-sub">' + escapeHtml(lastEdited) + '</div>' : '') +
            '</div>' +
            '<div class="item-qty">' + escapeHtml(String(item.qtyStandard || '-')) + ' ' + escapeHtml(item.unit || '') + '</div>' +
            '<div class="item-exp ' + cls + '">' + escapeHtml(item.expiryDate || '-') + '</div>' +
            '<div class="item-actions">' +
              '<button type="button" class="btn btn-outline btn-sm btn-edit-item" data-row="' + escapeHtml(String(item.sheetRow)) + '">แก้</button>' +
              '<button type="button" class="btn btn-danger btn-sm btn-del-item" data-row="' + escapeHtml(String(item.sheetRow)) + '">ลบ</button>' +
            '</div>' +
          '</div>'
        );
      }).join('');
    }

    function loadBox() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('error').style.display = 'none';
      google.script.run
        .withSuccessHandler(render)
        .withFailureHandler(function(err) {
          showError('โหลดไม่สำเร็จ: ' + (err && err.message ? err.message : err));
        })
        .getPublicBoxByToken(TOKEN, BOX_ID);
    }

    function reload() {
      google.script.run
        .withSuccessHandler(render)
        .withFailureHandler(function(err) { toast('โหลดไม่สำเร็จ: ' + (err && err.message ? err.message : err), true); })
        .getPublicBoxByToken(TOKEN, BOX_ID);
    }

    function findItem(row) {
      row = Number(row);
      return (currentData && currentData.items || []).find(function(it) { return Number(it.sheetRow) === row; });
    }

    document.getElementById('btnChangeActor').addEventListener('click', function() {
      openLoginModal(true);
    });

    document.getElementById('btnLoginCancel').addEventListener('click', function() {
      if (changingActor) closeModal('loginModal');
    });

    document.getElementById('btnLoginSubmit').addEventListener('click', function() {
      const name = document.getElementById('fLoginName').value.trim();
      const position = document.getElementById('fLoginPosition').value.trim();
      if (!name || !position) {
        toast('กรุณากรอกชื่อและตำแหน่ง', true);
        return;
      }
      const btn = document.getElementById('btnLoginSubmit');
      btn.disabled = true;
      const saved = getValidSavedUser();
      const userId = (saved && saved.userId)
        ? saved.userId
        : ('user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9));
      google.script.run
        .withSuccessHandler(function(result) {
          btn.disabled = false;
          if (!result || !result.success) {
            toast('บันทึกชื่อไม่สำเร็จ', true);
            return;
          }
          saveUser({ userId: userId, name: name, position: position });
          closeModal('loginModal');
          refreshActorChip();
          if (!currentData) loadBox();
          else toast('บันทึกชื่อผู้ทำรายการแล้ว');
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          toast('บันทึกชื่อไม่สำเร็จ: ' + (err && err.message ? err.message : err), true);
        })
        .saveUserInfo(userId, name, position);
    });

    document.getElementById('btnEditBoxNo').addEventListener('click', function() {
      if (!requireActor()) return;
      document.getElementById('fBoxNo').value = (currentData && currentData.box && currentData.box.boxNo) || '';
      openModal('boxModal');
    });

    document.getElementById('btnSaveBoxNo').addEventListener('click', function() {
      const actor = requireActor();
      if (!actor) return;
      const boxNo = document.getElementById('fBoxNo').value.trim();
      if (!boxNo) { toast('กรุณาระบุชื่อกล่อง', true); return; }
      const btn = document.getElementById('btnSaveBoxNo');
      btn.disabled = true;
      google.script.run
        .withSuccessHandler(function() {
          btn.disabled = false;
          closeModal('boxModal');
          toast('บันทึกชื่อกล่องสำเร็จ');
          reload();
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          toast('บันทึกไม่สำเร็จ: ' + (err && err.message ? err.message : err), true);
        })
        .updatePublicBoxByToken(TOKEN, { boxNo: boxNo }, actor, BOX_ID);
    });

    document.getElementById('btnAddItem').addEventListener('click', function() {
      if (!requireActor()) return;
      editingSheetRow = null;
      document.getElementById('itemModalTitle').textContent = 'เพิ่มยา';
      document.getElementById('fDrugName').value = '';
      document.getElementById('fUnit').value = '';
      document.getElementById('fQty').value = '';
      document.getElementById('fExpiry').value = '';
      openModal('itemModal');
    });

    document.getElementById('items').addEventListener('click', function(e) {
      const editBtn = e.target.closest('.btn-edit-item');
      const delBtn = e.target.closest('.btn-del-item');
      if (editBtn) {
        if (!requireActor()) return;
        const row = editBtn.getAttribute('data-row');
        const item = findItem(row);
        if (!item) return;
        editingSheetRow = Number(row);
        document.getElementById('itemModalTitle').textContent = 'แก้ไขยา';
        document.getElementById('fDrugName').value = item.drugName || '';
        document.getElementById('fUnit').value = item.unit || '';
        document.getElementById('fQty').value = item.qtyStandard || '';
        document.getElementById('fExpiry').value = item.expiryDate || '';
        openModal('itemModal');
        return;
      }
      if (delBtn) {
        const actor = requireActor();
        if (!actor) return;
        const row = Number(delBtn.getAttribute('data-row'));
        if (!confirm('ยืนยันลบยานี้จากกล่อง?')) return;
        google.script.run
          .withSuccessHandler(function() { toast('ลบยาสำเร็จ'); reload(); })
          .withFailureHandler(function(err) { toast('ลบไม่สำเร็จ: ' + (err && err.message ? err.message : err), true); })
          .deletePublicBoxItemByToken(TOKEN, row, actor, BOX_ID);
      }
    });

    document.getElementById('btnSaveItem').addEventListener('click', function() {
      const actor = requireActor();
      if (!actor) return;
      const payload = {
        drugName: document.getElementById('fDrugName').value.trim(),
        unit: document.getElementById('fUnit').value.trim(),
        qtyStandard: document.getElementById('fQty').value.trim(),
        expiryDate: document.getElementById('fExpiry').value
      };
      if (!payload.drugName) { toast('กรุณาระบุชื่อยา', true); return; }
      const btn = document.getElementById('btnSaveItem');
      btn.disabled = true;
      const onOk = function() {
        btn.disabled = false;
        closeModal('itemModal');
        toast('บันทึกรายการยาสำเร็จ');
        reload();
      };
      const onErr = function(err) {
        btn.disabled = false;
        toast('บันทึกไม่สำเร็จ: ' + (err && err.message ? err.message : err), true);
      };
      if (editingSheetRow) {
        google.script.run.withSuccessHandler(onOk).withFailureHandler(onErr)
          .updatePublicBoxItemByToken(TOKEN, editingSheetRow, payload, actor, BOX_ID);
      } else {
        google.script.run.withSuccessHandler(onOk).withFailureHandler(onErr)
          .addPublicBoxItemByToken(TOKEN, payload, actor, BOX_ID);
      }
    });

    if (!TOKEN) {
      showError('QR ไม่ถูกต้อง — ไม่พบรหัสกล่อง');
    } else {
      const saved = getValidSavedUser();
      if (saved) {
        currentUser = saved;
        refreshActorChip();
        loadBox();
      } else {
        document.getElementById('loading').style.display = 'none';
        openLoginModal(false);
      }
    }
  </script>
</body>
</html>
