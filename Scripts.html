<script>
    /* ---------------------- State ---------------------- */
    let allMeds = [];
    let options = { categories: [], locations: [] };
    let medCatalog = [];
    let editingCode = null;
    let debounceTimer = null;
    let appSettings = { redMonths: 4, yellowMonths: 8, hasLineToken: false };
    // ผู้ใช้จากแท็บ Users (ชื่อ + ตำแหน่ง)
    let currentUser = { email: '', name: '', position: '' };
    function getSavedUser(){ try { const s = localStorage.getItem('currentUser'); return s ? JSON.parse(s) : null; } catch(e){ return null; } }
    function saveUser(u){ try { localStorage.setItem('currentUser', JSON.stringify(u)); } catch(e){} }
    // โหมดแอดมิน (ปลดล็อกด้วยรหัสผ่าน) — คงสถานะต่อแท็บด้วย sessionStorage
    let isAdmin = (function(){ try { return sessionStorage.getItem('isAdmin') === '1'; } catch(e){ return false; } })();
    let allBoxes = [];
    let currentBoxId = null;
    let editingBoxItemIndex = -1;
    let activeBoxStatusTab = ''; // เก็บสถานะกล่องยาที่เลือกจากแท็บหรือแดชบอร์ด

    /* ---------------------- Render pagination state ---------------------- */
    const RENDER_PAGE_SIZE = 50; // จำนวนที่ render ต่อรอบ (กัน UI ค้างเมื่อข้อมูลเยอะ)
    let filteredMeds = [];
    let renderedCount = 0;
    // มุมมองรายการยา: 'list' (แถว) หรือ 'card' (การ์ด) — จำค่าไว้ใน localStorage
    function getSavedViewMode(){ try { return localStorage.getItem('medViewMode') === 'card' ? 'card' : 'list'; } catch(e){ return 'list'; } }
    function saveViewMode(m){ try { localStorage.setItem('medViewMode', m); } catch(e){} }
    let viewMode = getSavedViewMode();

    /* ---------------------- Elements ---------------------- */
    const resultsEl = document.getElementById('results');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const resetBtn = document.getElementById('resetBtn');
    const resultCount = document.getElementById('resultCount');
    const filterCategory = document.getElementById('filterCategory');
    const filterLocation = document.getElementById('filterLocation');
    const filterExpiry = document.getElementById('filterExpiry');
    const filterHad = document.getElementById('filterHad');

    /* ---------------------- Utils ---------------------- */
    function escapeHtml(str){ return (str === null || str === undefined) ? '' : String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;'); }

    function sanitizeInput(str, maxLength = 500) {
      if (typeof str !== 'string') return '';
      return str.trim().substring(0, maxLength);
    }

    function validateEmail(email) {
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test(String(email).toLowerCase());
    }

    function validateDate(dateStr) {
      const d = new Date(dateStr);
      return !isNaN(d.getTime());
    }

    function validateNumber(num, min = 0, max = Infinity) {
      const n = Number(num);
      return !isNaN(n) && n >= min && n <= max;
    }
    function isHighAlertDrug(item){ const f = [item['ชื่อยา'], item['ชื่อสามัญ'], item['หมวดหมู่']]; return f.some(v => { if(!v) return false; const s = v.toString(); return /\bHAD\b/i.test(s) || /high[\s-]?alert/i.test(s); }); }
    function getExpiryInfo(dateStr){ if(!dateStr) return { status:'nodate', diffDays:null, months:null }; const d = new Date(dateStr + 'T00:00:00+07:00'); if(isNaN(d.getTime())) return { status:'nodate', diffDays:null, months:null }; const today = new Date(); today.setHours(0, 0, 0, 0); d.setHours(0, 0, 0, 0); const diffDays = Math.round((d - today) / 86400000); if(diffDays < 0) return { status:'expired', diffDays, months:null }; const months = Math.floor(diffDays / 30); let status; if(months <= appSettings.redMonths) status = 'red'; else if(months <= appSettings.yellowMonths) status = 'yellow'; else status = 'green'; return { status, diffDays, months }; }
    function expiryLabel(info){ switch(info.status){ case 'expired': return 'หมดอายุแล้ว ' + Math.abs(info.diffDays) + ' วัน'; case 'red': return 'ใกล้หมดอายุ อีก ~' + info.months + ' เดือน'; case 'yellow': return 'ใกล้หมดอายุ อีก ~' + info.months + ' เดือน'; case 'green': return 'ปกติ เหลืออีก ~' + info.months + ' เดือน'; default: return 'ไม่มีข้อมูลวันหมดอายุ'; } }
    function showToast(msg, type){ const wrap = document.getElementById('toastWrap'); const el = document.createElement('div'); el.className = 'toast' + (type ? ' ' + type : ''); el.textContent = msg; wrap.appendChild(el); requestAnimationFrame(() => el.classList.add('show')); setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 3200); }
    function setButtonLoading(btn, loadingText){ btn.dataset.originalText = btn.textContent; btn.textContent = loadingText || 'กำลังทำงาน...'; btn.disabled = true; }
    function resetButtonLoading(btn){ if(btn.dataset.originalText) btn.textContent = btn.dataset.originalText; btn.disabled = false; }

    /* ---------------------- Confirm Modal (มือถือใช้แทน confirm) ---------------------- */
    let confirmCallback = null;
    const confirmModalOverlay = document.getElementById('confirmModalOverlay');
    const confirmModalMessage = document.getElementById('confirmModalMessage');
    function showConfirm(message, onConfirm) {
      confirmCallback = typeof onConfirm === 'function' ? onConfirm : null;
      confirmModalMessage.textContent = message;
      confirmModalOverlay.classList.add('open');
    }
    function closeConfirmModal() {
      confirmModalOverlay.classList.remove('open');
      confirmCallback = null;
    }
    document.getElementById('btnConfirmCancel').addEventListener('click', closeConfirmModal);
    document.getElementById('btnConfirmOk').addEventListener('click', () => {
      const cb = confirmCallback;
      closeConfirmModal();
      if (cb) cb();
    });
    confirmModalOverlay.addEventListener('click', e => { if (e.target === confirmModalOverlay) closeConfirmModal(); });

    /* ---------------------- UI + โหมดแอดมิน ---------------------- */
    function applyUI() {
      const actionRow = document.getElementById('medActionRow');
      if (actionRow) actionRow.style.display = 'flex';
      // แสดงชื่อ + ตำแหน่งผู้ใช้
      const chip = document.getElementById('userChip');
      if (chip && currentUser.name) {
        chip.textContent = '👤 ' + currentUser.name + ' · ' + currentUser.position;
      }
      applyAdminUI();
    }

    // ปรับหน้าตาตามสถานะโหมดแอดมิน (ปุ่ม admin-only ถูกซ่อน/โชว์ผ่าน body.is-admin ใน CSS)
    function applyAdminUI() {
      document.body.classList.toggle('is-admin', isAdmin);
      const btn = document.getElementById('menuManageUsers');
      if (btn) btn.textContent = isAdmin ? '🔓 ออกจากโหมดแอดมิน' : '👥 ผู้ใช้ / สิทธิ์';
    }

    function setAdmin(on) {
      isAdmin = !!on;
      try {
        if (isAdmin) sessionStorage.setItem('isAdmin', '1');
        else sessionStorage.removeItem('isAdmin');
      } catch (e) {}
      applyAdminUI();
    }

    /* ---------------------- View Switching ---------------------- */
    function switchView(view) {
      document.getElementById('medView').style.display = view === 'med' ? 'block' : 'none';
      document.getElementById('boxView').style.display = view === 'box' ? 'block' : 'none';
      document.querySelectorAll('#mainTabs .tab-item').forEach(t => {
        t.classList.toggle('active', t.dataset.view === view);
      });
      if (view === 'med') {
        document.getElementById('appTitle').textContent = 'ระบบค้นหารายการยา';
        document.getElementById('appSub').textContent = 'งานเภสัชกรรม · ตรวจสอบคลังยา จัดการข้อมูล และวันหมดอายุแบบเรียลไทม์';
      } else {
        document.getElementById('appTitle').textContent = 'ระบบกล่องยาฉุกเฉิน (RxEbox)';
        document.getElementById('appSub').textContent = 'จัดการกล่องยา รายการยา และตรวจสอบวันหมดอายุของกล่อง';
        loadBoxes();
      }
    }
    document.getElementById('mainTabs').addEventListener('click', (e) => {
      const tab = e.target.closest('.tab-item');
      if (!tab) return;
      switchView(tab.dataset.view);
    });

    /* ---------------------- Filter & Form Options ---------------------- */
    function populateFilterOptions(){
      const fillFilter = (select, values) => { const current = select.value; select.innerHTML = '<option value="">ทั้งหมด</option>' + values.slice().sort((a,b) => a.localeCompare(b,'th')).map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join(''); select.value = current; };
      fillFilter(filterCategory, options.categories);
      fillFilter(filterLocation, options.locations);
    }
    function populateFormOptions(){
      const fCategory = document.getElementById('fCategory');
      const fLocation = document.getElementById('fLocation');
      const fDept = document.getElementById('fDept');
      const fHomeDept = document.getElementById('fHomeDept');
      const fBoxDetailDept = document.getElementById('fBoxDetailDept');
      const fillForm = (select, values, keep) => { select.innerHTML = '<option value="">-- เลือก --</option>' + values.slice().sort((a,b) => a.localeCompare(b,'th')).map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join(''); if(keep) select.value = keep; };
      fillForm(fCategory, options.categories, fCategory.value);
      fillForm(fLocation, options.locations, fLocation.value);
      fillForm(fDept, options.locations, fDept.value);
      fillForm(fHomeDept, options.locations, fHomeDept.value);
      fillForm(fBoxDetailDept, options.locations, fBoxDetailDept.value);
    }

    /* ---------------------- สถิติ + แสดงผล (Medicine) ---------------------- */
    function updateStats(items){ let expired=0, red=0, yellow=0, green=0; items.forEach(m => { const info = getExpiryInfo(m['วันหมดอายุ']); if(info.status === 'expired') expired++; else if(info.status === 'red') red++; else if(info.status === 'yellow') yellow++; else if(info.status === 'green') green++; }); document.getElementById('statTotal').textContent = items.length; document.getElementById('statExpired').textContent = expired; document.getElementById('statRed').textContent = red; document.getElementById('statYellow').textContent = yellow; document.getElementById('statGreen').textContent = green; document.getElementById('lblRed').textContent = `ใกล้หมด 0-${appSettings.redMonths} เดือน`; document.getElementById('lblYellow').textContent = `ใกล้หมด ${appSettings.redMonths + 1}-${appSettings.yellowMonths} เดือน`; }

    function medCardHtml(item){
      const info = getExpiryInfo(item['วันหมดอายุ']);
      const cls = 'exp-' + info.status;
      const label = expiryLabel(info) + (item['วันหมดอายุ'] ? ' (' + escapeHtml(item['วันหมดอายุ']) + ')' : '');
      const had = isHighAlertDrug(item);
      const code = escapeHtml(item['รหัสยา']);
      const actions = `<div class="med-actions"><button class="btn btn-outline btn-sm btn-edit admin-only" data-code="${code}">✏️</button><button class="btn btn-danger btn-sm btn-delete admin-only" data-code="${code}">🗑️</button></div>`;
      return `<div class="med-card ${cls}"><div class="med-main"><div class="med-name${had ? ' had-name' : ''}">${escapeHtml(item['ชื่อยา'] || '-')}</div><div class="med-sub">${escapeHtml(item['ชื่อสามัญ'] || '')}${item['รหัสยา'] ? ' · รหัส ' + code : ''}</div><div class="med-tags">${had ? `<span class="tag tag-had">⚠️ HAD</span>` : ''}${item['หมวดหมู่'] ? `<span class="tag">${escapeHtml(item['หมวดหมู่'])}</span>` : ''}${item['ที่จัดเก็บ'] ? `<span class="tag">📍 ${escapeHtml(item['ที่จัดเก็บ'])}</span>` : ''}${item['Lot No.'] ? `<span class="tag">Lot ${escapeHtml(item['Lot No.'])}</span>` : ''}</div></div><div class="med-side"><div><div class="qty">${escapeHtml(String(item['จำนวนคงเหลือ'] ?? '-'))} ${escapeHtml(item['หน่วย'] || '')}</div><div class="exp-pill">${label}</div></div>${actions}</div></div>`;
    }

    // มุมมองแถว (list) — กระชับ เห็นได้มากต่อจอ
    function medRowHtml(item){
      const info = getExpiryInfo(item['วันหมดอายุ']);
      const cls = 'exp-' + info.status;
      const had = isHighAlertDrug(item);
      const code = escapeHtml(item['รหัสยา']);
      const expDate = item['วันหมดอายุ'] ? escapeHtml(item['วันหมดอายุ']) : '-';
      const actions = `<div class="mr-actions"><button class="btn btn-outline btn-sm btn-edit admin-only" data-code="${code}">✏️</button><button class="btn btn-danger btn-sm btn-delete admin-only" data-code="${code}">🗑️</button></div>`;
      return `<div class="med-row ${cls}">`
        + `<div class="mr-name${had ? ' had-name' : ''}">${had ? '⚠️ ' : ''}${escapeHtml(item['ชื่อยา'] || '-')}${item['ชื่อสามัญ'] ? ` <span class="mr-sub">${escapeHtml(item['ชื่อสามัญ'])}</span>` : ''}</div>`
        + `<div class="mr-cat">${escapeHtml(item['หมวดหมู่'] || '-')}</div>`
        + `<div class="mr-qty">${escapeHtml(String(item['จำนวนคงเหลือ'] ?? '-'))} ${escapeHtml(item['หน่วย'] || '')}</div>`
        + `<div class="mr-exp"><span class="exp-pill">${expDate}</span></div>`
        + actions
        + `</div>`;
    }

    function listHeaderHtml(){
      return `<div class="med-row med-row-head"><div>ชื่อยา</div><div>ประเภท</div><div>จำนวน</div><div>วันหมดอายุ</div><div class="mr-actions">จัดการ</div></div>`;
    }

    function updateViewToggleButtons(){
      document.querySelectorAll('#viewToggle .vt-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === viewMode));
    }

    function renderResults(items){
      filteredMeds = items || [];
      renderedCount = 0;
      if(filteredMeds.length === 0){
        resultsEl.classList.remove('list-mode');
        resultsEl.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><div>ไม่พบรายการยาที่ตรงกับเงื่อนไข</div></div>`;
        resultCount.textContent = 'ไม่พบผลลัพธ์';
        return;
      }
      resultCount.textContent = 'แสดง ' + filteredMeds.length + ' รายการ (จากทั้งหมด ' + allMeds.length + ' รายการ)';
      resultsEl.classList.toggle('list-mode', viewMode === 'list');
      resultsEl.innerHTML = (viewMode === 'list') ? listHeaderHtml() : '';
      renderMoreMeds();
    }

    // render เพิ่มทีละหน้า เพื่อไม่ให้ DOM ค้างเมื่อรายการยาเยอะ
    function renderMoreMeds(){
      const oldWrap = document.getElementById('loadMoreWrap');
      if (oldWrap) oldWrap.remove();
      const builder = (viewMode === 'list') ? medRowHtml : medCardHtml;
      const slice = filteredMeds.slice(renderedCount, renderedCount + RENDER_PAGE_SIZE);
      resultsEl.insertAdjacentHTML('beforeend', slice.map(builder).join(''));
      renderedCount += slice.length;
      if (renderedCount < filteredMeds.length) {
        const remaining = filteredMeds.length - renderedCount;
        resultsEl.insertAdjacentHTML('beforeend', `<div class="load-more-wrap" id="loadMoreWrap"><button class="btn btn-outline" id="btnLoadMore">โหลดเพิ่ม (เหลืออีก ${remaining} รายการ)</button></div>`);
        document.getElementById('btnLoadMore').addEventListener('click', renderMoreMeds);
      }
    }

    function applyFilters(){
      const kw = searchInput.value.trim().toLowerCase();
      const cat = filterCategory.value;
      const loc = filterLocation.value;
      const expStatus = filterExpiry.value;
      const hadOnly = filterHad.value === 'had';
      const filtered = allMeds.filter(item => {
        if(loc && item['ที่จัดเก็บ'] !== loc) return false;
        if(kw){ const matchKw = Object.keys(item).some(key => { const v = item[key]; return v !== null && v !== undefined && v.toString().toLowerCase().indexOf(kw) !== -1; }); if(!matchKw) return false; }
        if(cat && item['หมวดหมู่'] !== cat) return false;
        if(expStatus){ const info = getExpiryInfo(item['วันหมดอายุ']); if(info.status !== expStatus) return false; }
        if(hadOnly && !isHighAlertDrug(item)) return false;
        return true;
      });
      updateStats(filtered);
      renderResults(filtered);
    }

    /* ---------------------- โหลดข้อมูลใหม่ทั้งหมด ---------------------- */
    function reloadAll(){
      // ตรวจสอบว่ามีผู้ใช้ที่บันทึกไว้ในเครื่อง ถ้าไม่มี = ให้เปิด login modal
      const saved = getSavedUser();
      if (!saved || !saved.name || !saved.position) {
        openLoginModal();
        return;
      }
      currentUser = saved;
      
      google.script.run.withSuccessHandler(data => {
          allMeds = data.medicines || [];
          options = data.options || { categories: [], locations: [] };
          medCatalog = data.catalog || [];
          if(data.settings) appSettings = data.settings;
          applyUI();
          populateFilterOptions();
          populateFormOptions();
          applyFilters();
          handlePendingQrDeepLink();
        }).withFailureHandler(err => { resultsEl.innerHTML = `<div class="empty-state">เกิดข้อผิดพลาด: ${escapeHtml(err.message || err)}</div>`; showToast('โหลดข้อมูลไม่สำเร็จ: ' + (err.message || err), 'error'); }).getInitialData();
    }

    /* ---------------------- Custom Auto-complete (Search & Med Form) ---------------------- */
    let currentFocusSearch = -1;
    function closeSearchAutocompleteList(elmnt) { const items = document.getElementsByClassName("search-autocomplete-items"); for (let i = 0; i < items.length; i++) { if (elmnt !== items[i] && elmnt !== searchInput) items[i].parentNode.removeChild(items[i]); } currentFocusSearch = -1; }
    function handleSearchAutocomplete() { const val = searchInput.value; closeSearchAutocompleteList(); if (!val || val.trim().length < 1) return false; const valLower = val.trim().toLowerCase(); const container = searchInput.parentNode; const list = document.createElement("DIV"); list.setAttribute("class", "autocomplete-items search-autocomplete-items"); container.appendChild(list); let matchCount = 0; medCatalog.forEach(item => { const name = item['ชื่อยา'] || ''; const generic = item['ชื่อสามัญ'] || ''; if (name.toLowerCase().includes(valLower) || generic.toLowerCase().includes(valLower)) { matchCount++; if (matchCount > 10) return; const itemDiv = document.createElement("DIV"); itemDiv.innerHTML = `<strong>${escapeHtml(name.substr(0, val.length))}</strong>${escapeHtml(name.substr(val.length))}`; itemDiv.innerHTML += `<div style="font-size:0.75rem; color:var(--mac-muted);">${escapeHtml(generic)}</div>`; itemDiv.dataset.medName = name; itemDiv.addEventListener("mousedown", function(e) { e.preventDefault(); searchInput.value = this.dataset.medName; closeSearchAutocompleteList(); applyFilters(); }); list.appendChild(itemDiv); } }); if (matchCount === 0) list.innerHTML = `<div style="color:var(--mac-muted); padding:8px 12px;">ไม่พบรายการที่ตรงกัน (กด Enter เพื่อค้นหาจากทุกฟิลด์)</div>`; }
    function addActiveSearch(list) { if (!list) return false; removeActiveSearch(list); if (currentFocusSearch >= list.length) currentFocusSearch = 0; if (currentFocusSearch < 0) currentFocusSearch = (list.length - 1); list[currentFocusSearch].classList.add("autocomplete-active"); }
    function removeActiveSearch(list) { for (let i = 0; i < list.length; i++) list[i].classList.remove("autocomplete-active"); }
    searchBtn.addEventListener('click', () => { closeSearchAutocompleteList(); applyFilters(); });
    searchInput.addEventListener('input', () => { handleSearchAutocomplete(); clearTimeout(debounceTimer); debounceTimer = setTimeout(applyFilters, 300); });
    searchInput.addEventListener('keydown', e => { let list = document.getElementsByClassName("search-autocomplete-items")[0]; if (list) list = list.getElementsByTagName("div"); if (e.key === 'ArrowDown') { e.preventDefault(); currentFocusSearch++; addActiveSearch(list); } else if (e.key === 'ArrowUp') { e.preventDefault(); currentFocusSearch--; addActiveSearch(list); } else if (e.key === 'Enter') { e.preventDefault(); if (currentFocusSearch > -1 && list && list[currentFocusSearch]) list[currentFocusSearch].click(); else { closeSearchAutocompleteList(); applyFilters(); } } });
    [filterCategory, filterLocation, filterExpiry, filterHad].forEach(sel => sel.addEventListener('change', () => { closeSearchAutocompleteList(); applyFilters(); }));
    resetBtn.addEventListener('click', () => { searchInput.value = ''; filterCategory.value = ''; filterLocation.value = ''; filterExpiry.value = ''; filterHad.value = ''; closeSearchAutocompleteList(); applyFilters(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
    document.getElementById('viewToggle').addEventListener('click', (e) => { const btn = e.target.closest('.vt-btn'); if (!btn) return; viewMode = (btn.dataset.mode === 'card') ? 'card' : 'list'; saveViewMode(viewMode); updateViewToggleButtons(); applyFilters(); });
    updateViewToggleButtons();
    document.addEventListener("click", function (e) { closeSearchAutocompleteList(e.target); closeAutocompleteList(e.target); closeItemAutocompleteList(e.target); });

    resultsEl.addEventListener('click', (e) => {
      const editBtn = e.target.closest('.btn-edit');
      const deleteBtn = e.target.closest('.btn-delete');
      if (editBtn) openEditModal(editBtn.dataset.code);
      else if (deleteBtn) handleDelete(deleteBtn.dataset.code);
    });

    /* ---------------------- Modal: เพิ่ม/แก้ไขยา ---------------------- */
    const medModalOverlay = document.getElementById('medModalOverlay');
    const medFormError = document.getElementById('medFormError');
    function clearMedForm(){ ['fCode','fName','fGeneric','fQty','fUnit','fExpiry','fLot','fPrice'].forEach(id => document.getElementById(id).value = ''); document.getElementById('fCategory').value = ''; document.getElementById('fLocation').value = ''; medFormError.classList.remove('show'); medFormError.textContent = ''; closeAutocompleteList(); }
    function openAddModal(){ editingCode = null; clearMedForm(); populateFormOptions(); document.getElementById('medModalTitle').textContent = 'เพิ่มยาใหม่ (Master)'; document.getElementById('medModalSub').textContent = 'กรอกข้อมูลยาให้ครบถ้วนแล้วกดบันทึก'; document.getElementById('fCode').disabled = false; medModalOverlay.classList.add('open'); }
    function openEditModal(code){ const item = allMeds.find(m => (m['รหัสยา'] || '').toString() === code); if(!item){ showToast('ไม่พบข้อมูลยานี้', 'error'); return; } editingCode = item['รหัสยา']; clearMedForm(); populateFormOptions(); document.getElementById('medModalTitle').textContent = 'แก้ไขข้อมูลยา'; document.getElementById('medModalSub').textContent = 'รหัสยาเดิม: ' + editingCode; document.getElementById('fCode').value = item['รหัสยา'] || ''; document.getElementById('fName').value = item['ชื่อยา'] || ''; document.getElementById('fGeneric').value = item['ชื่อสามัญ'] || ''; document.getElementById('fCategory').value = item['หมวดหมู่'] || ''; document.getElementById('fQty').value = item['จำนวนคงเหลือ'] ?? ''; document.getElementById('fUnit').value = item['หน่วย'] || ''; document.getElementById('fExpiry').value = item['วันหมดอายุ'] || ''; document.getElementById('fLot').value = item['Lot No.'] || ''; document.getElementById('fLocation').value = item['ที่จัดเก็บ'] || ''; document.getElementById('fPrice').value = item['ราคา/หน่วย'] ?? ''; medModalOverlay.classList.add('open'); }

    function renderBoxes(boxes) {
      const boxResults = document.getElementById('boxResults');
      const filtered = boxes.filter(b => !activeBoxStatusTab || b.status === activeBoxStatusTab);

      if (!filtered || filtered.length === 0) {
        const createBtn = `<div style="margin-top:12px;"><button class="btn btn-primary" id="btnCreateFirstBox">➕ สร้างกล่องยาแรก</button></div>`;
        boxResults.innerHTML = `<div class="empty-state"><div>ยังไม่มีกล่องยาที่ตรงกับเงื่อนไข</div>${createBtn}</div>`;
        const firstBtn = document.getElementById('btnCreateFirstBox');
        if (firstBtn) firstBtn.addEventListener('click', () => document.getElementById('btnCreateBox').click());
        return;
      }
      boxResults.innerHTML = filtered.map(boxCardHtml).join('');
    }

    });

    // คลิกที่แท็บสถานะ
    document.getElementById('boxStatusTabs').addEventListener('click', (e) => {
      const tab = e.target.closest('.tab-item');
      if (!tab) return;
      activeBoxStatusTab = tab.dataset.status;
      document.querySelectorAll('#boxStatusTabs .tab-item').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      renderBoxes(allBoxes);
    });

    document.getElementById('boxResults').addEventListener('click', (e) => {
      const card = e.target.closest('.box-card');
      if (card) openBoxDetailModal(card.dataset.boxid);
    });

    document.getElementById('boxSearchInput').addEventListener('input', (e) => {
      const kw = e.target.value.trim().toLowerCase();
      const filtered = allBoxes.filter(b =>
        (b.boxNo || '').toLowerCase().includes(kw) ||
        (b.department || '').toLowerCase().includes(kw)
      );
      const finalFiltered = filtered.filter(b => !activeBoxStatusTab || b.status === activeBoxStatusTab);

      const boxResults = document.getElementById('boxResults');
      if (!finalFiltered || finalFiltered.length === 0) {
        boxResults.innerHTML = `<div class="empty-state"><div>ไม่พบกล่องยาที่ตรงกับเงื่อนไข</div></div>`;
        return;
      }
      boxResults.innerHTML = finalFiltered.map(boxCardHtml).join('');
    });

    // Create Box Modal
    const boxFormModalOverlay = document.getElementById('boxFormModalOverlay');
    document.getElementById('btnCreateBox').addEventListener('click', () => {
      document.getElementById('boxFormTitle').textContent = 'สร้างกล่องยาใหม่';
      document.getElementById('fBoxNo').value = '';
      document.getElementById('fHomeDept').value = '';
      document.getElementById('fDept').value = '';
      document.getElementById('fAlertDays').value = 30;
      document.getElementById('fBoxNotes').value = '';
      populateFormOptions();
      boxFormModalOverlay.classList.add('open');
    });
    document.getElementById('btnBoxFormCancel').addEventListener('click', () => boxFormModalOverlay.classList.remove('open'));
    document.getElementById('btnBoxFormSave').addEventListener('click', () => {
      const boxNo = sanitizeInput(document.getElementById('fBoxNo').value);
      const homeDept = sanitizeInput(document.getElementById('fHomeDept').value);
      const dept = sanitizeInput(document.getElementById('fDept').value);
      const alertDays = document.getElementById('fAlertDays').value;
      const notes = sanitizeInput(document.getElementById('fBoxNotes').value);

      if (!boxNo || boxNo.trim().length === 0) {
        showToast('กรุณาระบุหมายเลขกล่อง', 'error');
        return;
      }

      if(alertDays && !validateNumber(alertDays, 1)){
        showToast('จำนวนวันต้องเป็นตัวเลขที่มากกว่า 0', 'error');
        return;
      }

      const payload = {
        boxNo: boxNo,
        homeDepartment: homeDept,
        department: dept,
        alertDaysBefore: alertDays || 30,
        notes: notes
      };

      google.script.run.withSuccessHandler(res => {
        showToast('สร้างกล่องยาสำเร็จ', 'success');
        boxFormModalOverlay.classList.remove('open');
        loadBoxes();
      }).withFailureHandler(err => showToast('สร้างไม่สำเร็จ: ' + (err.message || err), 'error')).createBox(payload, currentUser.email || 'Admin');
    });

    // Box Detail Modal
    const boxDetailModalOverlay = document.getElementById('boxDetailModalOverlay');
    let currentBoxData = null;

    function openBoxDetailModal(boxId) {
      currentBoxId = boxId;
      google.script.run.withSuccessHandler(data => {
        currentBoxData = data;
        document.getElementById('boxDetailTitle').textContent = `กล่องยา: ${data.box.boxNo}`;
        document.getElementById('fBoxDetailDept').innerHTML = '<option value="">-- เลือก --</option>' + options.locations.map(l => `<option value="${escapeHtml(l)}" ${l === data.box.department ? 'selected' : ''}>${escapeHtml(l)}</option>`).join('');
        document.getElementById('boxExpDate').textContent = data.box.expiryDate || 'ไม่ระบุ';

        // แสดงปุ่มจัดการกล่องยาให้ทุกคน
        ['btnChangeDept','btnAddBoxItem','btnDeleteBox'].forEach(id => { const el = document.getElementById(id); if (el) el.style.display = ''; });
        document.getElementById('fBoxDetailDept').disabled = false;

        renderBoxItems(data.items);
        renderBoxHistory(data.history);

        boxDetailModalOverlay.classList.add('open');
      }).withFailureHandler(err => showToast('โหลดรายละเอียดกล่องไม่สำเร็จ: ' + (err.message || err), 'error')).getAdminBoxDetails(boxId);
    }

    function renderBoxItems(items) {
      const listEl = document.getElementById('boxItemsList');
      if (!items || items.length === 0) {
        listEl.innerHTML = `<div class="empty-state" style="padding:20px;"><div>ไม่มีรายการยาในกล่องนี้</div></div>`;
        return;
      }
      listEl.innerHTML = items.map((item, idx) => {
        const actions = `<div class="med-actions">
                <button class="btn btn-outline btn-sm btn-edit-item admin-only" data-idx="${escapeHtml(String(idx + 2))}">✏️</button>
                <button class="btn btn-danger btn-sm btn-delete-item admin-only" data-idx="${escapeHtml(String(idx + 2))}">🗑️</button>
              </div>`;
        return `
          <div class="med-card exp-green" style="border-top: 3px solid var(--mac-border);">
            <div class="med-main">
              <div class="med-name">${escapeHtml(item.drugName)}</div>
              <div class="med-sub">หน่วย: ${escapeHtml(item.unit || '-')} | วันหมดอายุ: ${escapeHtml(item.expiryDate || '-')}</div>
            </div>
            <div class="med-side">
              <div class="qty">${escapeHtml(String(item.qtyStandard || '-'))}</div>
              ${actions}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderBoxHistory(history) {
      const listEl = document.getElementById('boxHistoryList');
      if (!history || history.length === 0) {
        listEl.innerHTML = `<div class="empty-state" style="padding:20px;"><div>ไม่มีประวัติการเคลื่อนย้าย</div></div>`;
        return;
      }
      listEl.innerHTML = history.slice().reverse().map(h => {
        const actionType = escapeHtml(String(h.actionType || ''));
        const notes = escapeHtml(String(h.notes || ''));
        const timestamp = escapeHtml(String(h.timestamp || ''));
        const user = escapeHtml(String(h.user || '-'));
        const dept = escapeHtml(String(h.department || '-'));
        return `
        <div class="med-card exp-green" style="border-top: 3px solid var(--mac-muted);">
          <div class="med-main">
            <div class="med-name">${actionType}</div>
            <div class="med-sub">${notes}</div>
          </div>
          <div class="med-side">
            <div style="font-size:0.8rem; color:var(--mac-muted); text-align:right;">
              <div>${timestamp}</div>
              <div>โดย: ${user}</div>
              <div>แผนก: ${dept}</div>
            </div>
          </div>
        </div>
      `;
      }).join('');
    }

    // Modal Tabs
    document.querySelectorAll('.modal-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
      });
    });

    document.getElementById('btnBoxDetailClose').addEventListener('click', () => boxDetailModalOverlay.classList.remove('open'));

    document.getElementById('btnChangeDept').addEventListener('click', () => {
      const newDept = document.getElementById('fBoxDetailDept').value;
      if (!newDept) { showToast('กรุณาเลือกแผนก', 'error'); return; }
      google.script.run.withSuccessHandler(res => {
        showToast('ย้ายแผนกสำเร็จ', 'success');
        openBoxDetailModal(currentBoxId);
        loadBoxes();
      }).withFailureHandler(err => showToast('ย้ายแผนกไม่สำเร็จ: ' + (err.message || err), 'error')).updateBoxDetails(currentBoxId, { department: newDept }, currentUser.email || 'Admin');
    });

    document.getElementById('btnDeleteBox').addEventListener('click', () => {
      showConfirm('ยืนยันลบกล่องยานี้? รายการยาทั้งหมดในกล่องจะถูกลบด้วย', () => {
        google.script.run.withSuccessHandler(res => {
          showToast('ลบกล่องยาสำเร็จ', 'success');
          boxDetailModalOverlay.classList.remove('open');
          loadBoxes();
        }).withFailureHandler(err => showToast('ลบไม่สำเร็จ: ' + (err.message || err), 'error')).deleteBox(currentBoxId, currentUser.email || 'Admin');
      });
    });

    // Box Item CRUD
    const boxItemFormModalOverlay = document.getElementById('boxItemFormModalOverlay');
    const fItemDrugName = document.getElementById('fItemDrugName');
    let itemCurrentFocus = -1;

    function closeItemAutocompleteList(elmnt) {
      const items = document.getElementsByClassName("item-autocomplete-items");
      for (let i = 0; i < items.length; i++) {
        if (elmnt !== items[i] && elmnt !== fItemDrugName) items[i].parentNode.removeChild(items[i]);
      }
      itemCurrentFocus = -1;
    }

    function handleItemAutocomplete() {
      const val = fItemDrugName.value;
      closeItemAutocompleteList();
      if (!val || val.trim().length < 1) return false;
      const valLower = val.trim().toLowerCase();
      const container = fItemDrugName.parentNode;
      const list = document.createElement("DIV");
      list.setAttribute("class", "autocomplete-items item-autocomplete-items");
      container.appendChild(list);
      let matchCount = 0;
      medCatalog.forEach(item => {
        const name = item['ชื่อยา'] || '';
        if (name.toLowerCase().includes(valLower)) {
          matchCount++;
          if (matchCount > 10) return;
          const itemDiv = document.createElement("DIV");
          itemDiv.innerHTML = `<strong>${escapeHtml(name.substr(0, val.length))}</strong>${escapeHtml(name.substr(val.length))}`;
          itemDiv.dataset.medData = JSON.stringify(item);
          itemDiv.addEventListener("click", function() {
            const data = JSON.parse(this.dataset.medData);
            fItemDrugName.value = data['ชื่อยา'] || '';
            document.getElementById('fItemUnit').value = data['หน่วย'] || '';
            closeItemAutocompleteList();
          });
          list.appendChild(itemDiv);
        }
      });
    }

    fItemDrugName.addEventListener('input', handleItemAutocomplete);
    fItemDrugName.addEventListener('keydown', function(e) {
      let list = document.getElementsByClassName("item-autocomplete-items")[0];
      if (list) list = list.getElementsByTagName("div");
      if (e.key === 'ArrowDown') { e.preventDefault(); itemCurrentFocus++; addItemActive(list); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); itemCurrentFocus--; addItemActive(list); }
      else if (e.key === 'Enter') { e.preventDefault(); if (itemCurrentFocus > -1 && list) if (list[itemCurrentFocus]) list[itemCurrentFocus].click(); }
    });

    function addItemActive(list) { if (!list) return false; removeItemActive(list); if (itemCurrentFocus >= list.length) itemCurrentFocus = 0; if (itemCurrentFocus < 0) itemCurrentFocus = (list.length - 1); list[itemCurrentFocus].classList.add("autocomplete-active"); }
    function removeItemActive(list) { for (let i = 0; i < list.length; i++) list[i].classList.remove("autocomplete-active"); }

    document.getElementById('btnAddBoxItem').addEventListener('click', () => {
      editingBoxItemIndex = -1;
      document.getElementById('boxItemFormTitle').textContent = 'เพิ่มยาในกล่อง';
      document.getElementById('fItemDrugName').value = '';
      document.getElementById('fItemQty').value = '';
      document.getElementById('fItemUnit').value = '';
      document.getElementById('fItemExpiry').value = '';
      boxItemFormModalOverlay.classList.add('open');
    });

    document.getElementById('boxItemsList').addEventListener('click', (e) => {
      const editBtn = e.target.closest('.btn-edit-item');
      const deleteBtn = e.target.closest('.btn-delete-item');
      if (editBtn) {
        editingBoxItemIndex = parseInt(editBtn.dataset.idx, 10);
        const item = currentBoxData.items[editingBoxItemIndex - 2];
        if (item) {
          document.getElementById('boxItemFormTitle').textContent = 'แก้ไขยาในกล่อง';
          document.getElementById('fItemDrugName').value = item.drugName || '';
          document.getElementById('fItemQty').value = item.qtyStandard || '';
          document.getElementById('fItemUnit').value = item.unit || '';
          document.getElementById('fItemExpiry').value = item.expiryDate || '';
          boxItemFormModalOverlay.classList.add('open');
        }
      } else if (deleteBtn) {
        const idx = parseInt(deleteBtn.dataset.idx, 10);
        showConfirm('ยืนยันลบยานี้ออกจากกล่อง?', () => {
          google.script.run.withSuccessHandler(res => {
            showToast('ลบยาสำเร็จ', 'success');
            openBoxDetailModal(currentBoxId);
          }).withFailureHandler(err => showToast('ลบไม่สำเร็จ: ' + (err.message || err), 'error')).deleteAdminBoxItem(currentBoxId, idx, currentUser.email || 'Admin');
        });
      }
    });

    document.getElementById('btnBoxItemFormCancel').addEventListener('click', () => boxItemFormModalOverlay.classList.remove('open'));
    document.getElementById('btnBoxItemFormSave').addEventListener('click', () => {
      const drugName = sanitizeInput(document.getElementById('fItemDrugName').value);
      const qtyStandard = document.getElementById('fItemQty').value;
      const unit = sanitizeInput(document.getElementById('fItemUnit').value);
      const expiryDate = document.getElementById('fItemExpiry').value;

      if (!drugName || drugName.trim().length === 0) {
        showToast('กรุณาระบุชื่อยา', 'error');
        return;
      }

      if(qtyStandard && !validateNumber(qtyStandard, 0)){
        showToast('จำนวนต้องเป็นตัวเลขที่มากกว่า 0', 'error');
        return;
      }

      if(expiryDate && !validateDate(expiryDate)){
        showToast('รูปแบบวันที่ไม่ถูกต้อง', 'error');
        return;
      }

      const payload = {
        drugName: drugName,
        qtyStandard: qtyStandard || 0,
        unit: unit,
        expiryDate: expiryDate
      };

      if (editingBoxItemIndex === -1) {
        google.script.run.withSuccessHandler(res => {
          showToast('เพิ่มยาสำเร็จ', 'success');
          boxItemFormModalOverlay.classList.remove('open');
          openBoxDetailModal(currentBoxId);
        }).withFailureHandler(err => showToast('เพิ่มไม่สำเร็จ: ' + (err.message || err), 'error')).addAdminBoxItem(currentBoxId, payload, currentUser.email || 'Admin');
      } else {
        google.script.run.withSuccessHandler(res => {
          showToast('แก้ไขยาสำเร็จ', 'success');
          boxItemFormModalOverlay.classList.remove('open');
          openBoxDetailModal(currentBoxId);
        }).withFailureHandler(err => showToast('แก้ไขไม่สำเร็จ: ' + (err.message || err), 'error')).updateAdminBoxItem(currentBoxId, editingBoxItemIndex, payload, currentUser.email || 'Admin');
      }
    });

    document.getElementById('btnPrintLabel').addEventListener('click', () => {
      if (!currentBoxId) {
        showToast('ไม่พบกล่องยาที่เลือก', 'error');
        return;
      }
      const btn = document.getElementById('btnPrintLabel');
      setButtonLoading(btn, 'กำลังสร้าง QR...');
      google.script.run.withSuccessHandler(label => {
        resetButtonLoading(btn);
        openQrLabelModal([label], 'ฉลาก QR — ' + (label.boxNo || ''));
      }).withFailureHandler(err => {
        resetButtonLoading(btn);
        showToast('สร้างฉลากไม่สำเร็จ: ' + (err.message || err), 'error');
      }).getBoxLabelData(currentBoxId);
    });

    document.getElementById('btnPrintAllQr').addEventListener('click', () => {
      const btn = document.getElementById('btnPrintAllQr');
      setButtonLoading(btn, 'กำลังสร้าง QR...');
      google.script.run.withSuccessHandler(res => {
        resetButtonLoading(btn);
        const labels = (res && res.labels) || [];
        if (!labels.length) {
          showToast('ยังไม่มีกล่องยาให้พิมพ์ QR', 'error');
          return;
        }
        openQrLabelModal(labels, 'ฉลาก QR ทั้งหมด (' + labels.length + ' กล่อง)');
      }).withFailureHandler(err => {
        resetButtonLoading(btn);
        showToast('สร้างฉลากไม่สำเร็จ: ' + (err.message || err), 'error');
      }).getAllBoxLabelData();
    });

    /* ---------------------- QR Label Modal ---------------------- */
    const qrLabelModalOverlay = document.getElementById('qrLabelModalOverlay');
    function qrImgSrc(label) {
      if (label.qrDataUrl) return label.qrDataUrl;
      const data = label.scanUrl || ('RXEBOX:' + (label.qrToken || ''));
      return 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&ecc=M&margin=8&data='
        + encodeURIComponent(data);
    }
    function qrLabelCardHtml(label) {
      return `
        <div class="qr-label">
          <div class="qr-label-brand">RxEbox · กล่องยาฉุกเฉิน</div>
          <div class="qr-label-boxno">${escapeHtml(label.boxNo || '-')}</div>
          <img src="${escapeHtml(qrImgSrc(label))}" alt="QR ${escapeHtml(label.boxNo || '')}" width="160" height="160">
          <div class="qr-label-meta">
            แผนก: ${escapeHtml(label.department || '-')}
            ${label.expiryDate ? '<br>หมดอายุใกล้สุด: ' + escapeHtml(label.expiryDate) : ''}
          </div>
          <div class="qr-label-token">${escapeHtml(label.qrToken || '')}</div>
        </div>
      `;
    }
    function openQrLabelModal(labels, title) {
      document.getElementById('qrLabelTitle').textContent = title || 'ฉลาก QR ติดกล่อง';
      const warn = document.getElementById('qrLabelWarning');
      const missingUrl = labels.some(l => !l.webAppUrl);
      if (missingUrl) {
        warn.textContent = 'ยังไม่ได้ตั้งค่า Web App URL — QR อาจสแกนแล้วเปิดแอปไม่ได้ ไปที่ ตั้งค่า แล้ววางลิงก์ Deploy';
        warn.style.display = 'block';
        warn.classList.add('show');
      } else {
        warn.style.display = 'none';
        warn.classList.remove('show');
      }
      document.getElementById('qrLabelSheet').innerHTML = labels.map(qrLabelCardHtml).join('');
      qrLabelModalOverlay.classList.add('open');
    }
    document.getElementById('btnQrLabelClose').addEventListener('click', () => qrLabelModalOverlay.classList.remove('open'));
    document.getElementById('btnQrLabelPrint').addEventListener('click', () => {
      window.print();
    });
    qrLabelModalOverlay.addEventListener('click', e => {
      if (e.target === qrLabelModalOverlay) qrLabelModalOverlay.classList.remove('open');
    });

    /* ---------------------- QR Deep Link (สแกนติดกล่อง) ---------------------- */
    const rxeInit = window.__RXEBOX_INIT__ || {};
    let pendingQrToken = (rxeInit.qr || '').toString().trim();
    let pendingInitialView = (rxeInit.view || '').toString().trim();

    function handlePendingQrDeepLink() {
      if (!pendingQrToken) {
        if (pendingInitialView === 'box') switchView('box');
        return;
      }
      const token = pendingQrToken;
      pendingQrToken = '';
      switchView('box');
      google.script.run.withSuccessHandler(res => {
        if (res && res.boxId) {
          showToast('เปิดจาก QR: กล่อง ' + (res.box.boxNo || res.boxId), 'success');
          openBoxDetailModal(res.boxId);
        } else {
          showToast('ไม่พบกล่องจาก QR นี้', 'error');
        }
      }).withFailureHandler(err => {
        showToast('สแกน QR ไม่สำเร็จ: ' + (err.message || err), 'error');
      }).findBoxByQrToken(token);
    }

    /* ---------------------- Login Modal ---------------------- */
    function openLoginModal() {
      const modal = document.getElementById('loginModalOverlay');
      if (modal) modal.classList.add('open');
    }
    function closeLoginModal() {
      const modal = document.getElementById('loginModalOverlay');
      if (modal) modal.classList.remove('open');
    }
    document.getElementById('btnLoginSubmit')?.addEventListener('click', () => {
      const name = document.getElementById('fLoginName')?.value?.trim();
      const position = document.getElementById('fLoginPosition')?.value?.trim();
      if (!name || !position) {
        showToast('กรุณากรอกชื่อและตำแหน่ง', 'error');
        return;
      }
      
      // สร้าง userId ใหม่ (ใช้ timestamp + random)
      const userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
      
      google.script.run.withSuccessHandler(result => {
        if (result.success) {
          currentUser = { userId: userId, name: name, position: position };
          saveUser(currentUser);
          closeLoginModal();
          // ข้ามการ reloadAll() ตรงนี้ — แค่โหลดข้อมูลหลัก
          google.script.run.withSuccessHandler(data => {
            allMeds = data.medicines || [];
            options = data.options || { categories: [], locations: [] };
            medCatalog = data.catalog || [];
            if(data.settings) appSettings = data.settings;
            applyUI();
            populateFilterOptions();
            populateFormOptions();
            applyFilters();
            if (pendingQrToken || pendingInitialView === 'box') {
              handlePendingQrDeepLink();
            } else {
              switchView('med');
            }
          }).withFailureHandler(err => {
            resultsEl.innerHTML = `<div class="empty-state">เกิดข้อผิดพลาด: ${escapeHtml(err.message || err)}</div>`;
            showToast('โหลดข้อมูลไม่สำเร็จ: ' + (err.message || err), 'error');
          }).getInitialData();
        } else {
          showToast('บันทึกไม่สำเร็จ', 'error');
        }
      }).withFailureHandler(err => showToast('เกิดข้อผิดพลาด: ' + (err.message || err), 'error')).saveUserInfo(userId, name, position);
    });

    /* ---------------------- เริ่มต้นโหลดข้อมูล ---------------------- */
    reloadAll();
    if (!(window.__RXEBOX_INIT__ && window.__RXEBOX_INIT__.qr)) {
      switchView(pendingInitialView === 'box' ? 'box' : 'med');
    }
  </script>
