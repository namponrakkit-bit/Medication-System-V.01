<script>
     
    let allMeds = [];
    let options = { categories: [], locations: [] };
    let medCatalog = [];
    let editingCode = null;
    let debounceTimer = null;
    let appSettings = { redDays: 90, yellowDays: 180, notifyHour: 8, hasLineToken: false };
    let medTotal = 0;
    let medPage = 1;
    let medTotalPages = 1;
    let medSearchSeq = 0;
    
    const LOGIN_SESSION_MS = 10 * 60 * 1000;
    let currentUser = { email: '', name: '', position: '' };
    function getSavedUser(){ try { const s = localStorage.getItem('currentUser'); return s ? JSON.parse(s) : null; } catch(e){ return null; } }
    function clearUser(){ try { localStorage.removeItem('currentUser'); } catch(e){} }
    function saveUser(u){
      try {
        const payload = Object.assign({}, u, { loggedAt: Date.now() });
        localStorage.setItem('currentUser', JSON.stringify(payload));
        currentUser = payload;
      } catch(e){}
    }
    function getValidSavedUser(){
      const saved = getSavedUser();
      if (!saved || !saved.name || !saved.position) { clearUser(); return null; }
      const loggedAt = Number(saved.loggedAt) || 0;
      if (!loggedAt || (Date.now() - loggedAt) > LOGIN_SESSION_MS) {
        clearUser();
        return null;
      }
      return saved;
    }
    function touchSession(){
      const saved = getValidSavedUser();
      if (!saved) return false;
      saveUser(saved);
      return true;
    }
    let lastSessionTouchMs = 0;
    function touchSessionThrottled(){
      const now = Date.now();
      if (now - lastSessionTouchMs < 30000) return;
      lastSessionTouchMs = now;
      touchSession();
    }
    let allBoxes = [];
    let currentBoxId = null;
    let editingBoxItemIndex = -1;
    let activeBoxStatusTab = ''; 

     
    const RENDER_PAGE_SIZE = 50; 
    let filteredMeds = [];
    let renderedCount = 0;
    
    function getSavedViewMode(){ try { return localStorage.getItem('medViewMode') === 'card' ? 'card' : 'list'; } catch(e){ return 'list'; } }
    function saveViewMode(m){ try { localStorage.setItem('medViewMode', m); } catch(e){} }
    let viewMode = getSavedViewMode();

     
    const resultsEl = document.getElementById('results');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const resetBtn = document.getElementById('resetBtn');
    const resultCount = document.getElementById('resultCount');
    const filterCategory = document.getElementById('filterCategory');
    const filterLocation = document.getElementById('filterLocation');
    const filterExpiry = document.getElementById('filterExpiry');
    const filterHad = document.getElementById('filterHad');

     
    function escapeHtml(str){ return (str === null || str === undefined) ? '' : String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;'); }

    function sanitizeInput(str, maxLength = 500) {
      if (typeof str !== 'string') return '';
      return str.trim().substring(0, maxLength);
    }

    function validateEmail(email) {
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test(String(email).toLowerCase());
    }

    function validateDate(dateStr) {
      const d = new Date(dateStr);
      return !isNaN(d.getTime());
    }

    function validateNumber(num, min = 0, max = Infinity) {
      const n = Number(num);
      return !isNaN(n) && n >= min && n <= max;
    }
    function isHighAlertDrug(item){ const f = [item['ชื่อยา'], item['ชื่อสามัญ'], item['หมวดหมู่']]; return f.some(v => { if(!v) return false; const s = v.toString(); return /\bHAD\b/i.test(s) || /high[\s-]?alert/i.test(s); }); }
    function getExpiryInfo(dateStr){ if(!dateStr) return { status:'nodate', diffDays:null }; const d = new Date(dateStr + 'T00:00:00+07:00'); if(isNaN(d.getTime())) return { status:'nodate', diffDays:null }; const today = new Date(); today.setHours(0, 0, 0, 0); d.setHours(0, 0, 0, 0); const diffDays = Math.round((d - today) / 86400000); if(diffDays < 0) return { status:'expired', diffDays }; let status; if(diffDays <= appSettings.redDays) status = 'red'; else if(diffDays <= appSettings.yellowDays) status = 'yellow'; else status = 'green'; return { status, diffDays }; }
    function expiryLabel(info){ switch(info.status){ case 'expired': return 'หมดอายุแล้ว ' + Math.abs(info.diffDays) + ' วัน'; case 'red': return 'ใกล้หมดอายุ อีก ' + info.diffDays + ' วัน'; case 'yellow': return 'ใกล้หมดอายุ อีก ' + info.diffDays + ' วัน'; case 'green': return 'ปกติ เหลืออีก ' + info.diffDays + ' วัน'; default: return 'ไม่มีข้อมูลวันหมดอายุ'; } }
    function showToast(msg, type){ const wrap = document.getElementById('toastWrap'); const el = document.createElement('div'); el.className = 'toast' + (type ? ' ' + type : ''); el.textContent = msg; wrap.appendChild(el); requestAnimationFrame(() => el.classList.add('show')); setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 3200); }
    function setButtonLoading(btn, loadingText){ btn.dataset.originalText = btn.textContent; btn.textContent = loadingText || 'กำลังทำงาน...'; btn.disabled = true; }
    function resetButtonLoading(btn){ if(btn.dataset.originalText) btn.textContent = btn.dataset.originalText; btn.disabled = false; }

    function bindModalEnter(container, buttonId, opts) {
      if (!container) return;
      container.addEventListener('keydown', e => {
        if (e.key !== 'Enter' || e.shiftKey) return;
        if (e.target.tagName === 'TEXTAREA') return;
        if (opts?.skipIfAutocomplete && document.querySelector('.autocomplete-items')) return;
        const btn = document.getElementById(buttonId);
        if (btn && !btn.disabled) { e.preventDefault(); btn.click(); }
      });
    }

     
    let confirmCallback = null;
    const confirmModalOverlay = document.getElementById('confirmModalOverlay');
    const confirmModalMessage = document.getElementById('confirmModalMessage');
    function showConfirm(message, onConfirm) {
      confirmCallback = typeof onConfirm === 'function' ? onConfirm : null;
      confirmModalMessage.textContent = message;
      confirmModalOverlay.classList.add('open');
    }
    function closeConfirmModal() {
      confirmModalOverlay.classList.remove('open');
      confirmCallback = null;
    }
    document.getElementById('btnConfirmCancel').addEventListener('click', closeConfirmModal);
    document.getElementById('btnConfirmOk').addEventListener('click', () => {
      const cb = confirmCallback;
      closeConfirmModal();
      if (cb) cb();
    });
    confirmModalOverlay.addEventListener('click', e => { if (e.target === confirmModalOverlay) closeConfirmModal(); });

     
    function applyUI() {
      
      ['menuAddMed', 'menuExportCsv', 'menuExportSheet', 'menuAdminSettings'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = '';
      });
      const actionRow = document.getElementById('medActionRow');
      if (actionRow) actionRow.style.display = 'flex';
      const createBox = document.getElementById('btnCreateBox');
      if (createBox) createBox.style.display = '';
      
      const chip = document.getElementById('userChip');
      if (chip && currentUser.name) {
        chip.textContent = '👤 ' + currentUser.name + ' · ' + currentUser.position;
      }
    }

     
    function switchView(view) {
      document.getElementById('medView').style.display = view === 'med' ? 'block' : 'none';
      document.getElementById('boxView').style.display = view === 'box' ? 'block' : 'none';
      document.querySelectorAll('#mainTabs .tab-item').forEach(t => {
        t.classList.toggle('active', t.dataset.view === view);
      });
      if (view === 'med') {
        document.getElementById('appTitle').textContent = 'ระบบค้นหารายการยา';
        document.getElementById('appSub').textContent = 'งานเภสัชกรรม · ตรวจสอบคลังยา จัดการข้อมูล และวันหมดอายุแบบเรียลไทม์';
      } else {
        document.getElementById('appTitle').textContent = 'ระบบกล่องยาฉุกเฉิน (RxEbox)';
        document.getElementById('appSub').textContent = 'จัดการกล่องยา รายการยา และตรวจสอบวันหมดอายุของกล่อง';
        loadBoxes();
      }
    }
    document.getElementById('mainTabs').addEventListener('click', (e) => {
      const tab = e.target.closest('.tab-item');
      if (!tab) return;
      switchView(tab.dataset.view);
    });

     
    function populateFilterOptions(){
      const fillFilter = (select, values) => { const current = select.value; select.innerHTML = '<option value="">ทั้งหมด</option>' + values.slice().sort((a,b) => a.localeCompare(b,'th')).map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join(''); select.value = current; };
      fillFilter(filterCategory, options.categories);
      fillFilter(filterLocation, options.locations);
    }
    function populateFormOptions(){
      const fCategory = document.getElementById('fCategory');
      const fLocation = document.getElementById('fLocation');
      const fDept = document.getElementById('fDept');
      const fHomeDept = document.getElementById('fHomeDept');
      const fBoxDetailDept = document.getElementById('fBoxDetailDept');
      const fillForm = (select, values, keep) => { select.innerHTML = '<option value="">-- เลือก --</option>' + values.slice().sort((a,b) => a.localeCompare(b,'th')).map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join(''); if(keep) select.value = keep; };
      fillForm(fCategory, options.categories, fCategory.value);
      fillForm(fLocation, options.locations, fLocation.value);
      fillForm(fDept, options.locations, fDept.value);
      fillForm(fHomeDept, options.locations, fHomeDept.value);
      fillForm(fBoxDetailDept, options.locations, fBoxDetailDept.value);
    }

    /* ---------------------- สถิติ + แสดงผล (Medicine) ---------------------- */
    function applyServerStats(stats){
      stats = stats || {};
      document.getElementById('statTotal').textContent = stats.total != null ? stats.total : 0;
      document.getElementById('statExpired').textContent = stats.expired != null ? stats.expired : 0;
      document.getElementById('statRed').textContent = stats.red != null ? stats.red : 0;
      document.getElementById('statYellow').textContent = stats.yellow != null ? stats.yellow : 0;
      document.getElementById('statGreen').textContent = stats.green != null ? stats.green : 0;
      document.getElementById('lblRed').textContent = `ใกล้หมด ≤${appSettings.redDays} วัน`;
      document.getElementById('lblYellow').textContent = `ใกล้หมด ${appSettings.redDays + 1}-${appSettings.yellowDays} วัน`;
    }

    function medCardHtml(item){
      const info = getExpiryInfo(item['วันหมดอายุ']);
      const cls = 'exp-' + info.status;
      const label = expiryLabel(info) + (item['วันหมดอายุ'] ? ' (' + escapeHtml(item['วันหมดอายุ']) + ')' : '');
      const had = isHighAlertDrug(item);
      const code = escapeHtml(item['รหัสยา']);
      const actions = `<div class="med-actions"><button class="btn btn-outline btn-sm btn-edit" data-code="${code}">✏️</button><button class="btn btn-danger btn-sm btn-delete" data-code="${code}">🗑️</button></div>`;
      return `<div class="med-card ${cls}"><div class="med-main"><div class="med-name${had ? ' had-name' : ''}">${escapeHtml(item['ชื่อยา'] || '-')}</div><div class="med-sub">${escapeHtml(item['ชื่อสามัญ'] || '')}${item['รหัสยา'] ? ' · รหัส ' + code : ''}</div><div class="med-tags">${had ? `<span class="tag tag-had">⚠️ HAD</span>` : ''}${item['หมวดหมู่'] ? `<span class="tag">${escapeHtml(item['หมวดหมู่'])}</span>` : ''}${item['ที่จัดเก็บ'] ? `<span class="tag">📍 ${escapeHtml(item['ที่จัดเก็บ'])}</span>` : ''}${item['Lot No.'] ? `<span class="tag">Lot ${escapeHtml(item['Lot No.'])}</span>` : ''}</div></div><div class="med-side"><div><div class="qty">${escapeHtml(String(item['จำนวนคงเหลือ'] ?? '-'))} ${escapeHtml(item['หน่วย'] || '')}</div><div class="exp-pill">${label}</div></div>${actions}</div></div>`;
    }

    // มุมมองแถว (list) — กระชับ เห็นได้มากต่อจอ
    function medRowHtml(item){
      const info = getExpiryInfo(item['วันหมดอายุ']);
      const cls = 'exp-' + info.status;
      const had = isHighAlertDrug(item);
      const code = escapeHtml(item['รหัสยา']);
      const expDate = item['วันหมดอายุ'] ? escapeHtml(item['วันหมดอายุ']) : '-';
      const actions = `<div class="mr-actions"><button class="btn btn-outline btn-sm btn-edit" data-code="${code}">✏️</button><button class="btn btn-danger btn-sm btn-delete" data-code="${code}">🗑️</button></div>`;
      return `<div class="med-row ${cls}">`
        + `<div class="mr-name${had ? ' had-name' : ''}">${had ? '⚠️ ' : ''}${escapeHtml(item['ชื่อยา'] || '-')}${item['ชื่อสามัญ'] ? ` <span class="mr-sub">${escapeHtml(item['ชื่อสามัญ'])}</span>` : ''}</div>`
        + `<div class="mr-cat">${escapeHtml(item['หมวดหมู่'] || '-')}</div>`
        + `<div class="mr-qty">${escapeHtml(String(item['จำนวนคงเหลือ'] ?? '-'))} ${escapeHtml(item['หน่วย'] || '')}</div>`
        + `<div class="mr-exp"><span class="exp-pill">${expDate}</span></div>`
        + actions
        + `</div>`;
    }

    function listHeaderHtml(){
      return `<div class="med-row med-row-head"><div>ชื่อยา</div><div>ประเภท</div><div>จำนวน</div><div>วันหมดอายุ</div><div class="mr-actions">จัดการ</div></div>`;
    }

    function updateViewToggleButtons(){
      document.querySelectorAll('#viewToggle .vt-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === viewMode));
    }

    function renderResults(items){
      filteredMeds = items || [];
      renderedCount = 0;
      if(filteredMeds.length === 0){
        resultsEl.classList.remove('list-mode');
        resultsEl.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><div>ไม่พบรายการยาที่ตรงกับเงื่อนไข</div></div>`;
        resultCount.textContent = 'ไม่พบผลลัพธ์';
        return;
      }
      resultCount.textContent = 'แสดง ' + filteredMeds.length + ' / ' + medTotal + ' รายการ';
      resultsEl.classList.toggle('list-mode', viewMode === 'list');
      resultsEl.innerHTML = (viewMode === 'list') ? listHeaderHtml() : '';
      renderMoreMeds();
    }

    // แสดงรายการที่โหลดมาแล้วทั้งหมด + ปุ่มโหลดหน้าถัดไปจาก server
    function renderMoreMeds(){
      const oldWrap = document.getElementById('loadMoreWrap');
      if (oldWrap) oldWrap.remove();
      const builder = (viewMode === 'list') ? medRowHtml : medCardHtml;
      const slice = filteredMeds.slice(renderedCount);
      resultsEl.insertAdjacentHTML('beforeend', slice.map(builder).join(''));
      renderedCount = filteredMeds.length;
      if (medPage < medTotalPages) {
        const remaining = Math.max(medTotal - filteredMeds.length, 0);
        resultsEl.insertAdjacentHTML('beforeend', `<div class="load-more-wrap" id="loadMoreWrap"><button class="btn btn-outline" id="btnLoadMore">โหลดเพิ่ม (เหลืออีก ${remaining} รายการ)</button></div>`);
        document.getElementById('btnLoadMore').addEventListener('click', () => loadMedicinesPage(medPage + 1, true));
      }
    }

    function getMedicineFilterParams(page){
      return {
        q: searchInput.value.trim(),
        category: filterCategory.value,
        location: filterLocation.value,
        expiry: filterExpiry.value,
        had: filterHad.value,
        page: page || 1,
        pageSize: RENDER_PAGE_SIZE
      };
    }

    function applyInitialMedicinePayload(data){
      allMeds = data.medicines || [];
      medTotal = data.medicineTotal != null ? data.medicineTotal : allMeds.length;
      medPage = data.medicinePage || 1;
      medTotalPages = data.medicineTotalPages || 1;
      options = data.options || { categories: [], locations: [] };
      medCatalog = data.catalog || [];
      if (data.settings) appSettings = data.settings;
      if (data.stats) applyServerStats(data.stats);
      else applyServerStats({ total: medTotal, expired: 0, red: 0, yellow: 0, green: 0 });
      applyUI();
      populateFilterOptions();
      populateFormOptions();
      renderResults(allMeds);
    }

    function loadMedicinesPage(page, append){
      const seq = ++medSearchSeq;
      const params = getMedicineFilterParams(page);
      if (!append) {
        resultsEl.innerHTML = `<div class="empty-state"><div>กำลังโหลด...</div></div>`;
      }
      google.script.run.withSuccessHandler(res => {
        if (seq !== medSearchSeq) return;
        const items = res.items || [];
        if (append) allMeds = allMeds.concat(items);
        else allMeds = items;
        medTotal = res.total != null ? res.total : allMeds.length;
        medPage = res.page || page;
        medTotalPages = res.totalPages || 1;
        if (res.stats) applyServerStats(res.stats);
        renderResults(allMeds);
      }).withFailureHandler(err => {
        if (seq !== medSearchSeq) return;
        if (!append) {
          resultsEl.innerHTML = `<div class="empty-state">เกิดข้อผิดพลาด: ${escapeHtml(err.message || err)}</div>`;
        }
        showToast('โหลดรายการยาไม่สำเร็จ: ' + (err.message || err), 'error');
      }).searchMedicines(params);
    }

    function applyFilters(){
      medPage = 1;
      loadMedicinesPage(1, false);
    }

    /* ---------------------- โหลดข้อมูลใหม่ทั้งหมด ---------------------- */
    function reloadAll(){
      // ตรวจสอบเซสชัน (idle 10 นาที) — หมดอายุหรือไม่มี = เปิด login modal
      const saved = getValidSavedUser();
      if (!saved) {
        openLoginModal();
        return;
      }
      currentUser = saved;
      touchSession();

      google.script.run.withSuccessHandler(data => {
          applyInitialMedicinePayload(data);
        }).withFailureHandler(err => { resultsEl.innerHTML = `<div class="empty-state">เกิดข้อผิดพลาด: ${escapeHtml(err.message || err)}</div>`; showToast('โหลดข้อมูลไม่สำเร็จ: ' + (err.message || err), 'error'); }).getInitialData();
    }

    /* ---------------------- Custom Auto-complete (Search & Med Form) ---------------------- */
    let currentFocusSearch = -1;
    function closeSearchAutocompleteList(elmnt) { const items = document.getElementsByClassName("search-autocomplete-items"); for (let i = 0; i < items.length; i++) { if (elmnt !== items[i] && elmnt !== searchInput) items[i].parentNode.removeChild(items[i]); } currentFocusSearch = -1; }
    function handleSearchAutocomplete() { const val = searchInput.value; closeSearchAutocompleteList(); if (!val || val.trim().length < 1) return false; const valLower = val.trim().toLowerCase(); const container = searchInput.parentNode; const list = document.createElement("DIV"); list.setAttribute("class", "autocomplete-items search-autocomplete-items"); container.appendChild(list); let matchCount = 0; medCatalog.forEach(item => { const name = item['ชื่อยา'] || ''; const generic = item['ชื่อสามัญ'] || ''; if (name.toLowerCase().includes(valLower) || generic.toLowerCase().includes(valLower)) { matchCount++; if (matchCount > 10) return; const itemDiv = document.createElement("DIV"); itemDiv.innerHTML = `<strong>${escapeHtml(name.substr(0, val.length))}</strong>${escapeHtml(name.substr(val.length))}`; itemDiv.innerHTML += `<div style="font-size:0.75rem; color:var(--mac-muted);">${escapeHtml(generic)}</div>`; itemDiv.dataset.medName = name; itemDiv.addEventListener("mousedown", function(e) { e.preventDefault(); searchInput.value = this.dataset.medName; closeSearchAutocompleteList(); applyFilters(); }); list.appendChild(itemDiv); } }); if (matchCount === 0) list.innerHTML = `<div style="color:var(--mac-muted); padding:8px 12px;">ไม่พบรายการที่ตรงกัน (กด Enter เพื่อค้นหาจากทุกฟิลด์)</div>`; }
    function addActiveSearch(list) { if (!list) return false; removeActiveSearch(list); if (currentFocusSearch >= list.length) currentFocusSearch = 0; if (currentFocusSearch < 0) currentFocusSearch = (list.length - 1); list[currentFocusSearch].classList.add("autocomplete-active"); }
    function removeActiveSearch(list) { for (let i = 0; i < list.length; i++) list[i].classList.remove("autocomplete-active"); }
    searchBtn.addEventListener('click', () => { closeSearchAutocompleteList(); applyFilters(); });
    searchInput.addEventListener('input', () => { handleSearchAutocomplete(); clearTimeout(debounceTimer); debounceTimer = setTimeout(applyFilters, 300); });
    searchInput.addEventListener('keydown', e => { let list = document.getElementsByClassName("search-autocomplete-items")[0]; if (list) list = list.getElementsByTagName("div"); if (e.key === 'ArrowDown') { e.preventDefault(); currentFocusSearch++; addActiveSearch(list); } else if (e.key === 'ArrowUp') { e.preventDefault(); currentFocusSearch--; addActiveSearch(list); } else if (e.key === 'Enter') { e.preventDefault(); if (currentFocusSearch > -1 && list && list[currentFocusSearch]) list[currentFocusSearch].click(); else { closeSearchAutocompleteList(); applyFilters(); } } });
    [filterCategory, filterLocation, filterExpiry, filterHad].forEach(sel => sel.addEventListener('change', () => { closeSearchAutocompleteList(); applyFilters(); }));
    resetBtn.addEventListener('click', () => { searchInput.value = ''; filterCategory.value = ''; filterLocation.value = ''; filterExpiry.value = ''; filterHad.value = ''; closeSearchAutocompleteList(); applyFilters(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
    document.getElementById('viewToggle').addEventListener('click', (e) => { const btn = e.target.closest('.vt-btn'); if (!btn) return; viewMode = (btn.dataset.mode === 'card') ? 'card' : 'list'; saveViewMode(viewMode); updateViewToggleButtons(); renderResults(allMeds); });
    updateViewToggleButtons();
    document.addEventListener("click", function (e) { closeSearchAutocompleteList(e.target); closeAutocompleteList(e.target); closeItemAutocompleteList(e.target); });

    resultsEl.addEventListener('click', (e) => {
      const editBtn = e.target.closest('.btn-edit');
      const deleteBtn = e.target.closest('.btn-delete');
      if (editBtn) openEditModal(editBtn.dataset.code);
      else if (deleteBtn) handleDelete(deleteBtn.dataset.code);
    });

    /* ---------------------- Modal: เพิ่ม/แก้ไขยา ---------------------- */
    const medModalOverlay = document.getElementById('medModalOverlay');
    const medFormError = document.getElementById('medFormError');
    function clearMedForm(){ ['fCode','fName','fGeneric','fQty','fUnit','fExpiry','fLot','fPrice'].forEach(id => document.getElementById(id).value = ''); document.getElementById('fCategory').value = ''; document.getElementById('fLocation').value = ''; medFormError.classList.remove('show'); medFormError.textContent = ''; closeAutocompleteList(); }
    function openAddModal(){ editingCode = null; clearMedForm(); populateFormOptions(); document.getElementById('medModalTitle').textContent = 'เพิ่มยาใหม่ (Master)'; document.getElementById('medModalSub').textContent = 'กรอกข้อมูลยาให้ครบถ้วนแล้วกดบันทึก'; document.getElementById('fCode').disabled = false; medModalOverlay.classList.add('open'); }

    const boxItemFormModalOverlay = document.getElementById('boxItemFormModalOverlay');
    const fItemDrugName = document.getElementById('fItemDrugName');
    let itemCurrentFocus = -1;

    function closeItemAutocompleteList(elmnt) {
      const items = document.getElementsByClassName("item-autocomplete-items");
      for (let i = 0; i < items.length; i++) {
        if (elmnt !== items[i] && elmnt !== fItemDrugName) items[i].parentNode.removeChild(items[i]);
      }
      itemCurrentFocus = -1;
    }

    function handleItemAutocomplete() {
      const val = fItemDrugName.value;
      closeItemAutocompleteList();
      if (!val || val.trim().length < 1) return false;
      const valLower = val.trim().toLowerCase();
      const container = fItemDrugName.parentNode;
      const list = document.createElement("DIV");
      list.setAttribute("class", "autocomplete-items item-autocomplete-items");
      container.appendChild(list);
      let matchCount = 0;
      medCatalog.forEach(item => {
        const name = item['ชื่อยา'] || '';
        if (name.toLowerCase().includes(valLower)) {
          matchCount++;
          if (matchCount > 10) return;
          const itemDiv = document.createElement("DIV");
          itemDiv.innerHTML = `<strong>${escapeHtml(name.substr(0, val.length))}</strong>${escapeHtml(name.substr(val.length))}`;
          itemDiv.dataset.medData = JSON.stringify(item);
          itemDiv.addEventListener("click", function() {
            const data = JSON.parse(this.dataset.medData);
            fItemDrugName.value = data['ชื่อยา'] || '';
            document.getElementById('fItemUnit').value = data['หน่วย'] || '';
            closeItemAutocompleteList();
          });
          list.appendChild(itemDiv);
        }
      });
    }

    fItemDrugName.addEventListener('input', handleItemAutocomplete);
    fItemDrugName.addEventListener('keydown', function(e) {
      let list = document.getElementsByClassName("item-autocomplete-items")[0];
      if (list) list = list.getElementsByTagName("div");
      if (e.key === 'ArrowDown') { e.preventDefault(); itemCurrentFocus++; addItemActive(list); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); itemCurrentFocus--; addItemActive(list); }
      else if (e.key === 'Enter') { e.preventDefault(); if (itemCurrentFocus > -1 && list) if (list[itemCurrentFocus]) list[itemCurrentFocus].click(); }
    });

    function addItemActive(list) { if (!list) return false; removeItemActive(list); if (itemCurrentFocus >= list.length) itemCurrentFocus = 0; if (itemCurrentFocus < 0) itemCurrentFocus = (list.length - 1); list[itemCurrentFocus].classList.add("autocomplete-active"); }
    function removeItemActive(list) { for (let i = 0; i < list.length; i++) list[i].classList.remove("autocomplete-active"); }

    // ขนาดฉลาก Godex — ค่าเริ่มต้น 8.5×6.1 ซม. (85×61 มม.)
    const GODEX_LABEL_PRESETS = [
      { id: '85x61', w: 85, h: 61, label: '8.5×6.1 ซม. (มาตรฐาน)' },
      { id: '50x30', w: 50, h: 30, label: '5.0×3.0 ซม.' },
      { id: '60x40', w: 60, h: 40, label: '6.0×4.0 ซม.' },
      { id: '50x50', w: 50, h: 50, label: '5.0×5.0 ซม.' },
      { id: '70x50', w: 70, h: 50, label: '7.0×5.0 ซม.' }
    ];
    function getSavedGodexSizeId() {
      try { return localStorage.getItem('godexLabelSize') || '85x61'; } catch (e) { return '85x61'; }
    }
    function saveGodexSizeId(id) {
      try { localStorage.setItem('godexLabelSize', id); } catch (e) {}
    }
    function getGodexPreset(id) {
      return GODEX_LABEL_PRESETS.find(p => p.id === id) || GODEX_LABEL_PRESETS[0];
    }
    function getSavedGodexOffset() {
      try {
        return {
          x: parseFloat(localStorage.getItem('godexOffsetX') || '0') || 0,
          y: parseFloat(localStorage.getItem('godexOffsetY') || '0') || 0
        };
      } catch (e) { return { x: 0, y: 0 }; }
    }
    function saveGodexOffset(x, y) {
      try {
        localStorage.setItem('godexOffsetX', String(x));
        localStorage.setItem('godexOffsetY', String(y));
      } catch (e) {}
    }

    function buildGodexEzpl(data, preset) {
      const dpi = 8; 
      const wMm = preset.w, hMm = preset.h, gapMm = 3;
      const url = String(data.scanUrl || '');
      const boxNo = String(data.boxNo || '').replace(/[\r\n,]/g, ' ').substring(0, 28);
      const dept = String(data.department || '-').replace(/[\r\n,]/g, ' ').substring(0, 28);
      const status = String(data.status || '').replace(/[\r\n,]/g, ' ').substring(0, 20);
      const count = String(data.itemCount || 0);
      const urlLen = unescape(encodeURIComponent(url)).length;
      const off = getSavedGodexOffset();
      const ox = Math.round(off.x * dpi);
      const oy = Math.round(off.y * dpi);

      
      const landscape = wMm >= hMm;
      let qrX, qrY, qrMul, textLines;
      if (landscape) {
        qrMul = (preset.id === '85x61')
          ? 5
          : Math.max(3, Math.min(6, Math.floor((hMm - 12) * dpi / 33)));
        const qrSize = 33 * qrMul;
        const margin = Math.round(2.5 * dpi);
        qrX = Math.max(margin, (wMm * dpi) - qrSize - margin) + ox;
        qrY = Math.max(margin, Math.floor(((hMm * dpi) - qrSize) / 2)) + oy;
        const tx = 16 + ox;
        textLines = [
          'AD,' + tx + ',' + (Math.floor(hMm * dpi * 0.18) + oy) + ',1,1,0,0,BOX ' + boxNo,
          'AB,' + tx + ',' + (Math.floor(hMm * dpi * 0.40) + oy) + ',1,1,0,0,Dept: ' + dept,
          'AB,' + tx + ',' + (Math.floor(hMm * dpi * 0.56) + oy) + ',1,1,0,0,' + status + ' / ' + count + ' items',
          'AB,' + tx + ',' + (Math.floor(hMm * dpi * 0.72) + oy) + ',1,1,0,0,Scan QR for meds'
        ];
      } else {
        qrMul = Math.max(3, Math.min(6, Math.floor((Math.min(wMm, hMm) - 14) * dpi / 33)));
        const qrSize = 33 * qrMul;
        qrX = Math.max(16, Math.floor(((wMm * dpi) - qrSize) / 2)) + ox;
        qrY = Math.floor(hMm * dpi * 0.30) + oy;
        textLines = [
          'AD,' + (12 + ox) + ',' + (16 + oy) + ',1,1,0,0,BOX ' + boxNo,
          'AB,' + (12 + ox) + ',' + (46 + oy) + ',1,1,0,0,' + dept,
          'AB,' + (12 + ox) + ',' + (Math.min(hMm * dpi - 18, qrY + qrSize + 10)) + ',1,1,0,0,Scan QR'
        ];
      }
      return ['^Q' + hMm + ',' + gapMm, '^W' + wMm, '^H12', '^S4', '^P1', '^AT', '^L']
        .concat(textLines)
        .concat(['W' + qrX + ',' + qrY + ',3,2,M,8,' + qrMul + ',' + urlLen + ',0', url, 'E'])
        .join('\r\n');
    }
    window.__downloadGodexEzpl = function(data, sizeId) {
      const preset = getGodexPreset(sizeId);
      const ezpl = buildGodexEzpl(data, preset);
      const blob = new Blob([ezpl], { type: 'application/octet-stream' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'godex-box-' + String(data.boxNo || 'label').replace(/[^\w\-]+/g, '_') + '-' + preset.id + '.prn';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 1500);
      showToast('ดาวน์โหลดไฟล์ Godex .prn แล้ว', 'success');
    };

        '.stage{padding:16px;display:flex;justify-content:center;position:relative}',
        '.label{background:#fff;border:1px dashed #999;display:flex;flex-direction:row;align-items:center;text-align:left;overflow:hidden;gap:2mm}',
        '.label.stack{flex-direction:column;text-align:center;gap:1mm}',
        '.textcol{flex:1;min-width:0;padding-right:1mm}',
        '.brand{font-size:8pt;font-weight:700;letter-spacing:.04em;margin:0}',
        '.boxno{font-size:15pt;font-weight:800;margin:.5mm 0;line-height:1.1;word-break:break-word}',
        '.sub{font-size:8.5pt;margin:.4mm 0;line-height:1.2;font-weight:600}',
        '.scan{font-size:8pt;font-weight:700;margin-top:1mm}',
        '.qr{image-rendering:pixelated;background:#fff;flex:0 0 auto;display:block}',
        '@media print{',
        '  html,body{width:100%;height:100%;margin:0!important;padding:0!important;background:#fff!important}',
        '  .bar,.tip{display:none!important}',
        '  .stage{padding:0!important;margin:0!important;width:100%;height:100%;position:relative}',
        '  .label{position:absolute;top:0;left:0;border:0!important;box-shadow:none!important;background:#fff}',
        '}',
        '</style></head><body>',
        '<div class="bar">',
        '<label>ขนาด</label>',
        '<select id="sizeSel">' + presetOpts + '</select>',
        '<label>X มม.</label>',
        '<input id="offX" type="number" step="0.5" value="' + initialOff.x + '">',
        '<label>Y มม.</label>',
        '<input id="offY" type="number" step="0.5" value="' + initialOff.y + '">',
        '<button class="p" id="btnPrint" type="button">พิมพ์ Godex</button>',
        '<button class="g" id="btnEzpl" type="button">ดาวน์โหลด .prn</button>',
        '</div>',
        '<div class="tip">ขนาดมาตรฐาน: <b>8.5 × 6.1 ซม. (85×61 มม.)</b><br>',
        'ไดรเวอร์ Godex: กระดาษ 85×61 มม., Scale 100%, ปิด Fit to page<br>',
        'ถ้าเลื่อน: ปรับ X/Y ทีละ 0.5–1 มม. (บวก = ขวา/ลง)</div>',
        '<div class="stage"><div class="label" id="label"><div class="textcol">',
        '<div class="brand">RXEBOX</div><div class="boxno" id="boxNoText"></div>',
        '<div class="sub" id="deptText"></div><div class="sub" id="metaText"></div>',
        '<div class="scan" id="scanText">สแกนเพื่อดูรายการยา</div></div>',
        '<img class="qr" id="qrImg" src="' + qrImg + '" alt="QR"></div></div>',
        '<script>',
        'var DATA=' + JSON.stringify(payload) + ';',
        'var PRESETS=' + JSON.stringify(GODEX_LABEL_PRESETS) + ';',
        'var label=document.getElementById("label");',
        'var sizeSel=document.getElementById("sizeSel");',
        'var qrImg=document.getElementById("qrImg");',
        'var offX=document.getElementById("offX");',
        'var offY=document.getElementById("offY");',
        'function readOff(){return {x:parseFloat(offX.value)||0,y:parseFloat(offY.value)||0};}',
        'function saveOff(){var o=readOff(); try{localStorage.setItem("godexOffsetX",String(o.x));localStorage.setItem("godexOffsetY",String(o.y));}catch(e){}}',
        'function applySize(){',
        'var p=PRESETS.find(function(x){return x.id===sizeSel.value})||PRESETS[0];',
        'try{localStorage.setItem("godexLabelSize",p.id)}catch(e){}',
        'saveOff();',
        'var o=readOff();',
        'var row=p.w>=p.h; label.className="label"+(row?"":" stack");',
        'label.style.width=p.w+"mm"; label.style.height=p.h+"mm";',
        'label.style.padding=(p.id==="85x61")?"1.8mm 2mm":"1.5mm";',
        'label.style.transform="translate("+o.x+"mm,"+o.y+"mm)";',
        'var qrMm;',
        'if(p.id==="85x61"){ qrMm=41; }',
        'else if(row){ qrMm=Math.max(18,Math.min(p.h-8, Math.floor(p.w*0.42))); }',
        'else { qrMm=Math.max(18,Math.min(p.w-8, Math.floor(p.h*0.50))); }',
        'qrImg.style.width=qrMm+"mm"; qrImg.style.height=qrMm+"mm";',
        'var brand=document.querySelector(".brand"), boxno=document.querySelector(".boxno"), subs=document.querySelectorAll(".sub"), scan=document.getElementById("scanText");',
        'if(p.id==="85x61"){ brand.style.fontSize="8pt"; boxno.style.fontSize="15pt"; for(var i=0;i<subs.length;i++) subs[i].style.fontSize="8.5pt"; scan.style.fontSize="8pt"; }',
        'else if(p.h<=35){ brand.style.fontSize="7pt"; boxno.style.fontSize="11pt"; for(var j=0;j<subs.length;j++) subs[j].style.fontSize="7pt"; scan.style.fontSize="7pt"; }',

        'document.getElementById("boxNoText").textContent=DATA.boxNo||"-";',

        'saveOff();',
        'if(window.opener&&window.opener.__downloadGodexEzpl){window.opener.__downloadGodexEzpl(DATA,sizeSel.value);}',

        '<\/script></body></html>'

      const w = window.open('', '_blank', 'width=640,height=720');
      if (!w) { showToast('เบราว์เซอร์บล็อกหน้าต่างพิมพ์ — อนุญาต popup แล้วลองใหม่', 'error'); return; }
      w.document.open();
      w.document.write(html);
      w.document.close();
      saveGodexSizeId(initialId);
    }

</script>
